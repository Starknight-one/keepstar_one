<!DOCTYPE html>
<html>
<body style="font-family: -apple-system, sans-serif; color: #1A1A1A; background: #F8F9FA; padding: 32px;">
  <div style="max-width: 520px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 40px;">
    <h1 style="font-size: 24px; margin: 0 0 12px;">Reset your password</h1>
    <p style="color: #5F6368; font-size: 15px; line-height: 1.6;">
      We received a request to reset the password for <strong>{{.Email}}</strong>.
      Click the link below to choose a new one. This link expires in 1 hour.
    </p>
    <p style="margin: 28px 0;">
      <a href="{{.Link}}" style="display: inline-block; background: #1A1A1A; color: #fff; padding: 14px 28px; border-radius: 100px; text-decoration: none; font-weight: 500;">
        Reset password
      </a>
    </p>
    <p style="color: #5F6368; font-size: 13px;">
      If you didn't request this, you can safely ignore this email.
    </p>
  </div>
</body>
</html>
