<!DOCTYPE html>
<html>
<body style="font-family: -apple-system, sans-serif; color: #1A1A1A; background: #F8F9FA; padding: 32px;">
  <div style="max-width: 520px; margin: 0 auto; background: #fff; border-radius: 16px; padding: 40px;">
    <h1 style="font-size: 24px; margin: 0 0 12px;">Your verification code</h1>
    <p style="color: #5F6368; font-size: 15px; line-height: 1.6;">
      Enter this code to complete your sign-in. It expires in 15 minutes.
    </p>
    <div style="margin: 28px 0; font-size: 36px; font-weight: 700; letter-spacing: 8px; text-align: center; color: #1A1A1A;">
      {{.Code}}
    </div>
    <p style="color: #5F6368; font-size: 13px;">
      If you didn't try to sign in, change your password immediately.
    </p>
  </div>
</body>
</html>
