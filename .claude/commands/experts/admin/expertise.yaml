  recent_milestones:
    - "Magic-link race-fix (2026-04-29 commit 0fdaf61) — block email when newly-created user has no memberships"
    - "Resend HTTP adapter (2026-04-29 commit dab0629) — replaces SMTP that hangs on Railway"
    - "Shopify install + magic-link install flow (2026-04-29 commit 27f8a56)"
    - "Shopify install dedicated landing page (2026-04-29 commit 978f10e)"
    - "Magic-link usecase test suite (2026-04-29 commit fc3c1e6)"
    - "Auth full stack — OAuth/2FA/sessions/workspaces/invites — DONE 2026-04-19/21"
  hot_files:
    - "shopify/client.go (1302 LOC) — owned by catalog expert; admin only via OAuth glue"
    - "canvas_adapter.go (870 LOC) — split candidate when more design system features land"
    - "merge_apply.go (804 LOC) — catalog domain"
    - "cmd/server/main.go (798 LOC) — DI bootstrap with all routes; growing as features add. Split candidate by registering route groups."
    - "shopify_v2.go (786 LOC) — catalog domain (new install flow)"
    - "CanvasPage.jsx (785 LOC) — frontend; growth signal as canvas matures"
    - "harvester_lite.go (736 LOC) — catalog domain"
    - "discovery_tools.go (726 LOC) — catalog domain"
