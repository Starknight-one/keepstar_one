# Widget Expertise
# V5 embeddable chat widget — React 19 + Vite 7 IIFE + Shadow DOM.
# Renders a v9 scene-graph Document returned by the V5 pipeline backend.

overview:
  layer: "frontend"
  path: "project_v5/frontend/"
  build_target: "widget.js (IIFE bundle)"
  embed_pattern: |
    <script src="https://v5-engine-production.up.railway.app/widget.js"
            data-tenant="<slug>"></script>
  framework: "React 19, Vite 7"
  isolation: "Shadow DOM (mode: open)"
  served_by: "project_v5 backend's static fileserver (GET /); widget.js served same-origin"
  api_url_detection: "widget.jsx auto-detects apiBaseUrl from script.src.origin — no data-api needed when served same-origin"
  data_contract: "Renders Document (v9 scene graph) produced by engine-v5 pipeline"

entry_points:
  bootstrap:
    file: "src/widget.jsx"
    purpose: "IIFE entry. Reads data-tenant from script tag, derives apiBaseUrl from script.src.origin, attaches Shadow DOM, mounts WidgetApp"
  root_component:
    file: "src/WidgetApp.jsx"
    purpose: "Root React component. Manages chat-open state, provides RenderContext, renders ChatPanel + scene-graph area"
  chat:
    path: "src/chat/"
    files:
      - "ChatPanel.jsx — orchestrates message list, input, loading state, onUpdateDocument callback"
      - "MessageList.jsx — renders chat message history"
  api:
    path: "src/api/"
    purpose: "V5 backend client — POST /pipeline, session management, navigation, actions"

renderer:
  overview: "Type-dispatched scene-graph walker. SceneGraphRenderer → NodeRenderer → node components."
  path: "src/renderer/"

  scene_graph_renderer:
    file: "src/renderer/SceneGraphRenderer.jsx"
    purpose: "Top-level Document walker. Filters reusable component definitions, logs debug summary, wraps output in RendererErrorBoundary."
    null_guard: "Returns null if !document || !Array.isArray(document.children)"
    reusable_filter: "children.filter(c => !c?.reusable) — component defs live at root for resolver but must not render"
    error_boundary: "Wrapped in <RendererErrorBoundary resetKey={document}> — resets on new document object"

  error_boundary:
    file: "src/renderer/RendererErrorBoundary.jsx"
    type: "React class ErrorBoundary"
    on_error: "console.error + returns null — widget area blank until next valid document"
    auto_reset: "getDerivedStateFromProps resets hasError when resetKey (document reference) changes"

  node_renderer:
    file: "src/renderer/NodeRenderer.jsx"
    purpose: "Type dispatcher — switch on node.type → Frame/Group/Text/Image/Ref component"
    null_guard: "Returns null if !node || typeof node !== 'object'"
    unknown_type: "console.warn + return null (no crash)"

  node_components:
    Frame:
      file: "src/renderer/nodes/Frame.jsx"
      purpose: "Flexbox container. Handles drill_detail click for replicate clones."
      sizing: "sizingStyle(node) — width/minWidth/maxWidth (number→px, string→passthrough)"
      drill: "computeDrillProps(node, ctx) — fires drill_detail action if __templateOrigin + prefetch entity found"
      children_guard: "Array.isArray(node.children) ? node.children : []"
    Group:
      file: "src/renderer/nodes/Group.jsx"
      purpose: "Plain column wrapper (16 LOC)"
    Text:
      file: "src/renderer/nodes/Text.jsx"
      purpose: "Leaf: node.content → formatValue(format) → wrapText(wrapper) → JSX"
      null_content: "formatValue(null, ...) → '' (handled in format.js)"
    Image:
      file: "src/renderer/nodes/Image.jsx"
      purpose: "Lazy-loaded image. URL resolution: fills[0].url → node.content (http string) → content[0] (array) → null (omit)"
    Ref:
      file: "src/renderer/nodes/Ref.jsx"
      purpose: "Fallback for unresolved refs (backend ResolveAndInline pre-inlines; this is a safety net)"

  utilities:
    format_js:
      file: "src/renderer/format.js"
      entry: "formatValue(content, format)"
      formats: ["currency", "stars", "stars-compact", "stars-text", "percent", "number", "date", "text"]
      null_guard: "content null/undefined/'' → returns ''"
      error_recovery: "try-catch in formatCurrencyNumber + formatDate with fallbacks"
    wrapper_js:
      file: "src/renderer/wrapper.js"
      entry: "wrapText(content, wrapper, node)"
      wrappers:
        button: "<button> — dispatches node.action on click"
        link: "<a> — opens node.action.params.url"
        visual_only: ["badge", "tag", "pill", "alert → <span> with CSS class"]
        none: "passthrough"
    action_dispatch:
      file: "src/renderer/actionDispatch.js"
      entry: "dispatchAction(action, ctx)"
      action_kinds:
        backend: ["like", "unlike", "cart_add", "cart_remove", "drill_detail", "back"]
        frontend: ["external_link", "search", "open_category"]
      drill_logic: "prefetch hit → fillTemplate (instant) + background /navigation/expand; cache miss → cold /navigation/expand"
      error_handling: "try-catch in dispatchBackendAction, dispatchDrill, dispatchBack — logs + re-throws"
    fill_template:
      file: "src/renderer/fillTemplate.js"
      entry: "fillTemplate(template, entity)"
      purpose: "Instant drill-down: fill a template Document with one entity's data without round-trip"
      binding:
        text: "node.fieldBinding → node.content"
        image: "node.fieldBinding → node.fills[0].url"
        other: "node.fieldBinding → node.value"
      clone: "structuredClone(template) to avoid cache mutation"
    render_context:
      file: "src/renderer/RenderContext.js"
      shape: |
        {
          apiBaseUrl: string,
          tenantSlug: string | null,
          sessionId: string | null,
          prefetch: { adjacentTemplate: {[entityType]: Document}, entities: {[entityType]: [Entity]} },
          onUpdateDocument: (doc) => void,
          onSearch: (query) => void
        }
      default: "All fields have safe no-op defaults"

build:
  config: "project_v5/frontend/vite.config.js"
  format: "iife"
  output: "dist/widget.js"
  dev_port: 5173
  served_same_origin: "Dockerfile copies dist/ → /app/static in V5 backend; GET / serves widget.js"
  api_url: "Auto-detected from script.src.origin in production; falls back to localhost:8084 in dev"

tests:
  path: "project_v5/frontend/tests/"
  framework: "vitest + jsdom"
  coverage: "SceneGraphRenderer smoke tests (renderer.test.jsx) + 3 fixture tests; 38 tests total"
  run: "cd project_v5/frontend && npm test"

invariants:
  - "RendererErrorBoundary resets on new document reference — every new pipeline response creates a new document object, ensuring the boundary resets between turns."
  - "Reusable component definitions (node.reusable=true) MUST be filtered before render — they live at document root for the resolver but should never reach the screen."
  - "fillTemplate uses structuredClone — never mutates the prefetch cache. Mutating cache = subsequent drills see wrong data."
  - "dispatchAction is async (fetch calls) but click handlers don't await — drill instant path fires onUpdateDocument synchronously before background sync."
  - "widget.js is served same-origin from V5 backend — apiBaseUrl auto-detection from script.src.origin only works when the script is fetched from the backend domain."

gotchas:
  - "Back button is not yet implemented in V5 widget (known gap A4). navigation/back API exists on backend; frontend handler is missing."
  - "RendererErrorBoundary returns null on error — widget area blanks until next valid document. 'Last valid state' pattern (show previous document) would require lifting lastValidDocument to WidgetApp level."
  - "fillTemplate binding is one-level — node.fieldBinding = 'attributes.skin_type' (nested path) returns undefined silently. Backend fieldBinding names should be flat."
  - "Frame.jsx drill logic reads prefetch.adjacentTemplate[entityType] — if entity type in the node doesn't match the prefetch key, drill falls back to cold path (no instant preview)."
  - "No session cache (localStorage) in V5 yet — F5 resets chat state. This is a known gap from V4 feature parity."
  - "widget.jsx auto-detects apiBaseUrl from script.src.origin — in local dev (file:// or non-8084 port), falls back to hardcoded localhost:8084."

related_experts:
  - "engine-v5 — owns the Document + node property shape this renderer consumes. New node types or property key renames cascade to NodeRenderer dispatch + node components."
  - "pipeline-agents — POST /api/v1/pipeline returns {document, adjacentTemplates, entities, treeMap}. Shape changes cascade to RenderContext and fillTemplate."
  - "catalog — field definitions drive fieldBinding keys in node trees; fillTemplate.js binding and format.js format values must match catalog field types."
