      - "project_v5/frontend/src/**/*.jsx"
      - "project_v5/frontend/src/**/*.js"
      - "project_v5/frontend/src/**/*.css"
      - "project_v5/frontend/vite.config.js"
      - "project_v5/frontend/package.json"

  admin:
    globs:
      - "project_admin/backend/internal/usecases/auth*.go"
      - "project_admin/backend/internal/usecases/billing.go"
      - "project_admin/backend/internal/usecases/canvas.go"
      - "project_admin/backend/internal/usecases/settings.go"
      - "project_admin/backend/internal/handlers/handler_auth*.go"
      - "project_admin/backend/internal/handlers/handler_billing*.go"
