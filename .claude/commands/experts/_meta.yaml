# Vertical experts → file glob mapping.
# Single source of truth used by:
#   1. .claude/hooks/sync_experts_on_session_end.sh (auto-sync on Claude close)
#   2. .claude/commands/sync-experts.md (manual /sync-experts slash command)
#
# Each domain lists glob patterns (fnmatch / brace-expansion supported) covering
# files whose changes should trigger a refresh of that expert's expertise.yaml.
#
# Editing rules:
# - Keep patterns specific. Over-broad globs cause needless self-improve runs.
# - When you ADD or RENAME a major file in a domain, update the relevant glob.
# - When you ADD a new vertical expert: add it here AND create the
#   .claude/commands/experts/<name>/{expertise.yaml,self-improve.md,question.md} trio.

experts:
  catalog:
    globs:
      - "project_admin/backend/internal/usecases/{harvester,discovery,merge,enrichment,match,junk,products,stock,import,integrations,csv_mapping,auto_map,category_classifier,validate_artifact}*.go"
      - "project_admin/backend/internal/adapters/postgres/catalog*.go"
      - "project_admin/backend/internal/adapters/postgres/master_variants*.go"
      - "project_admin/backend/internal/adapters/postgres/{candidates,mapping_artifact,merge_apply_tx,merge_reports,import_adapter,integrations_adapter,shopify_staging,audit_adapter}*.go"
      - "project_admin/backend/internal/adapters/shopify/**/*.go"
      - "project_admin/backend/internal/handlers/handler_{categories,products,curator_merge,enrichment,import,integrations,junk,stock,api_v1}*.go"
      - "project_admin/backend/cmd/crawler/**/*.go"
      - "project_admin/backend/internal/units/**/*.go"
      - "project_v5/backend/internal/adapters/postgres/postgres_catalog.go"
      - "project_v5/backend/internal/adapters/postgres/postgres_catalog_vector.go"

  engine-v5:
    globs:
      - "project_v5/backend/internal/engine/**/*.go"
      - "project_v5/backend/internal/tools/tool_visual_assembly*.go"
      - "project_v5/backend/internal/domain/node_types.go"
      - "project_v5/backend/internal/domain/atom_role.go"

  pipeline-agents:
    globs:
      - "project_v5/backend/internal/usecases/pipeline_*.go"
      - "project_v5/backend/internal/usecases/agent1_*.go"
      - "project_v5/backend/internal/usecases/agent2_*.go"
      - "project_v5/backend/internal/usecases/{prefetch,span_helper,state_reconstruct,state_rollback,prompt_cache}*.go"
      - "project_v5/backend/internal/prompts/**/*.go"
      - "project_v5/backend/internal/tools/tool_catalog_search*.go"
      - "project_v5/backend/internal/tools/tool_history_lookup*.go"
      - "project_v5/backend/internal/tools/tool_state_filter*.go"
      - "project_v5/backend/internal/tools/tool_registry*.go"
      - "project_v5/backend/internal/adapters/anthropic/**/*.go"
      - "project_v5/backend/internal/handlers/handler_{pipeline,session,readyz}*.go"
      - "project_v5/backend/internal/adapters/postgres/{postgres_state,postgres_trace}*.go"

  widget:
