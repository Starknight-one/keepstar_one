# Pipeline-Agents Expertise
# V5 two-agent chat pipeline. Agent1 (NLU/data) + Agent2 (render). Owns
# pipeline_execute orchestration, prompts, tools, anthropic adapter,
# span tracing, prompt caching, state/session, HTTP handlers.

overview:
  layer: "chat-pipeline"
  path: "project_v5/backend/internal/{usecases,prompts,tools,adapters/anthropic,adapters/openai}/"
  go_module: "keepstar_v5"
  purpose: |
    Orchestrates the chat pipeline per turn:
      Agent1 (NLU + data) → catalog_search / state_filter / history_lookup
      Agent2 (Render)     → visual_assembly tool → engine-v5 scene-graph
    Plus span tracing, prompt caching, state snapshots, prefetch payload.
  contract:
    input:  "POST /api/v1/pipeline {session_id, query, tenant_slug}"
    output: "{ document, adjacentTemplates, entities, traceId, treeMap, warnings }"
  ports:
    local: "8084"
    prod:  "v5-engine-production.up.railway.app (US region, Railway)"

orchestration:
  entry_point:
    file: "internal/usecases/pipeline_execute.go"
    type: "PipelineExecuteUseCase"
    method: "Execute(ctx, req) (*PipelineExecuteResponse, error)"
  pipeline_steps:
    - "0. SpanCollector init — every step adds a span; persisted to v5_chat_session_traces"
    - "1. Ensure session — GetSession or create; TenantID threaded from req.TenantSlug"
    - "2. TurnID — req.TurnID or new uuid; groups Agent1+Agent2 deltas"
    - "3. Agent1.Execute — NLU+data; calls catalog_search/state_filter/history_lookup; writes state"
    - "4. Agent2.Execute — render; calls visual_assembly → engine-v5 → Document + TreeMap"
    - "5. Prefetch — build adjacentTemplates (1 detail template per entity type) + entities for instant drill"
    - "6. Build response — document + adjacentTemplates + entities + treeMap + trace"
    - "7. recordTrace — persist to v5_chat_session_traces (best-effort async)"
  related_files:
    - "internal/usecases/prefetch.go — builds adjacentTemplates + entities for prefetch payload"
    - "internal/usecases/span_helper.go — span construction helpers"
    - "internal/usecases/state_reconstruct.go — reconstruct state from delta history"
    - "internal/usecases/state_rollback.go — rollback state on failed pipeline turn"

agent1:
  file: "internal/usecases/agent1_execute.go"
  prompt_cache_file: "internal/usecases/agent1_prompt_cache.go"
  tools_provided: ["catalog_search", "state_filter", "history_lookup"]
  system_prompt:
    file: "internal/prompts/agent1_prompt.go"
    purpose: "NLU guidance: intent classification, tool selection, query enrichment"
  output: "state.current.data + state.current.meta written via state port"

agent2:
  file: "internal/usecases/agent2_execute.go"
  tools_provided: ["visual_assembly"]
  system_prompt:
    file: "internal/prompts/agent2_prompt.go"
    type: "var (not const) — built by buildAgent2SystemPrompt() at startup"
    structure: "agent2PromptPart1 + presets.SystemPresetsBlock + agent2PromptPart2"
    preset_auto_gen: "SystemPresetsBlock generated from engine/presets/SystemPresetSeeds + SystemPresetDescriptions — adding a preset + description is sufficient, no manual prompt edit"
    mode_section: "REQUIRED rebuild|modify enum; modify hint: 1-5 ops typical, more → rebuild"
    sections: ["HOW IT WORKS", "MODE (rebuild/modify)", "PRESETS (auto-generated)", "REPLICATE", "OPS VOCABULARY", "FIELD BINDING", "FORMAT+WRAPPER", "BUILDING", "COMPOSING", "MODIFYING EXISTING", "TREE_MAP", "DECISION RULES", "ANTI-PATTERNS"]
  prompt_assembly:
    file: "internal/prompts/fields_block.go"
    functions:
      - "FormatFieldsBlock(ctx, fdPort, tenantSlugOrID, entityType, sampleLimit) — per-tenant <fields> XML block"
      - "AssembleSystemPrompt(base, fieldsBlock string) — joins base + fieldsBlock"
    todo: "<tenant_design_context> block (tenant-published presets) documented as 'later' in code comment"
  prompt_cache:
    file: "internal/usecases/prompt_cache.go"
    type: "PromptCache struct (sync.Map per tenant)"
    methods:
      - "GetOrBuild(ctx, tenantSlugOrID, sampleLimit) — returns cached or builds + caches"
      - "Invalidate(tenantSlugOrID) — drops entry; called when tenant_design_context version bumps"
    cache_key: "tenant slug (or UUID)"
    note: "Agent2SystemPrompt is a var initialized at startup — PromptCache wraps the per-tenant fields block assembly only; the base prompt (including preset block) is assembled once globally"

prompts:
  agent1_file: "internal/prompts/agent1_prompt.go"
  agent2_file: "internal/prompts/agent2_prompt.go"
  fields_block_file: "internal/prompts/fields_block.go"
  cache_invariant: "Tool definitions sorted by name in tool registry — Anthropic cache hashes byte-for-byte; map iteration randomness breaks cache_read"

tools:
  registry: "internal/tools/ — tool executors implement Definition() + Execute()"
  registered_tools:
    catalog_search:
      file: "internal/tools/tool_catalog_search.go"
      purpose: "Hybrid catalog search — SQL keyword + pgvector cosine + RRF merge"
      fallback: "embedding failure → SQL-only search"
    state_filter:
      file: "internal/tools/tool_state_filter.go"
      purpose: "Filter already-loaded state.data without DB call"
    history_lookup:
      file: "internal/tools/tool_history_lookup.go"
      purpose: "Search conversation history for past queries/answers"
    visual_assembly:
      file: "internal/tools/tool_visual_assembly.go"
      purpose: "Agent2's sole tool. Validates ops + preset, runs engine-v5 pipeline, writes Document to state.template"
      mode: "REQUIRED enum: rebuild | modify (no default)"
      call_shapes:
        - "(a) preset name ± ops — most common"
        - "(b) ops only — freestyle rebuild or modify tweak"
        - "(c) multi-widget compose — multiple top-level frame inserts in one rebuild call"

llm_adapters:
  anthropic:
    path: "internal/adapters/anthropic/"
    env: "ANTHROPIC_API_KEY, LLM_MODEL (default claude-haiku-4-5-20251001)"
    cache_strategy: "System prompt + tool definitions cached; second-to-last message cache point covers conversation history"
    span_instrumentation: "Emits {stage}.llm, {stage}.llm.ttfb, {stage}.llm.body spans"
    slow_warn: "Logs [WARN] if TTFB > 10s"
  openai:
    path: "internal/adapters/openai/"
    purpose: "EmbeddingPort for catalog vector search"
    env: "OPENAI_API_KEY, EMBEDDING_MODEL (default text-embedding-3-small)"

state_and_trace:
  state_port:
    path: "internal/adapters/postgres/"
    tables: "chat_session_state, chat_session_deltas"
    methods: ["GetState", "SaveState", "AppendDelta", "GetDeltas"]
  trace:
    table: "v5_chat_session_traces"
    purpose: "Per-turn trace persistence for Curator UI (ChatsPage + ChatDetailPage)"
    writer: "best-effort async — pipeline continues even if trace write fails"
    reader: "curator/ service reads shared Neon DB directly"
  retention:
    conversation_trim: "20 messages max (trimConversationHistory)"

handlers:
  pipeline:  "internal/handlers/handler_pipeline.go — POST /api/v1/pipeline"
  session:   "internal/handlers/handler_session.go — POST /session/init, GET /session/{id}"
  navigation: "internal/handlers/handler_navigation.go — POST /navigation/expand, /navigation/back"
  action:    "internal/handlers/handler_action.go — POST /api/v1/actions (like/cart)"
  readyz:    "internal/handlers/handler_readyz.go — GET /readyz (pgxpool.Ping; used by Railway health check)"
  routes:    "internal/handlers/routes.go"
  middleware: ["middleware_cors.go", "middleware_logging.go", "middleware_tenant.go"]

invariants:
  - "Tool definitions MUST be sorted by name in registry — Anthropic caches the tool array byte-for-byte; unsorted = 0% cache_read."
  - "visual_assembly is the ONLY entry into engine-v5. Direct engine calls bypass tenant preset resolution and tracing."
  - "Agent2SystemPrompt is a var (not const) — built once at startup by buildAgent2SystemPrompt(). Changing engine/presets/ auto-propagates without prompt rewrite."
  - "TurnID groups deltas — same turn's Agent1+Agent2 writes share TurnID for delta replay."
  - "Span collector lives in ctx — propagate via domain.WithSpanCollector / SpanFromContext; lose ctx = lose spans."
  - "PromptCache key is tenant slug/UUID — adding tenant_design_context block will require Invalidate() call on tenant config change."

gotchas:
  - "V5 was deployed in Singapore region initially while Anthropic API + Neon are us-east — caused ~75% of observed 8s p50 latency. After US migration: 1881-2423ms warm, 3446ms cold. Region matters."
  - "V5 catalog_search was keyword-only ILIKE until chunk 16 — hybrid (pgvector+RRF) ported from V4. Chunk 16 closed this gap."
  - "Agent2 modify-mode over-emission (A2 gap): Agent2 fires modify even when state has data from a different category, skipping catalog_search. 1-5 ops hint added to MODE section as mitigation."
  - "Anthropic prompt caching needs ≥4096 tokens for Haiku — below threshold, cache writes succeed but reads never hit. Padding via tool definitions ensures threshold is met."
  - "v5_chat_session_traces writes are best-effort async — a failed write doesn't fail the turn; curator may see gaps in trace view."
  - "state_rollback.go exists for failed pipeline turns — if Agent2 fails after Agent1 writes state, rollback restores pre-turn state to avoid stale data on retry."

active_known_gaps:
  tracker: "docs/v5-known-gaps.md"
  items:
    A1: "Greeting handling — V5 emits empty_not_found on 'Привет'"
    A2: "modify-vs-rebuild misclassification — 'другая категория' doesn't fire catalog_search if state non-empty"
    A3: "replicate count + pagination — V5 hardcoded 3, V4 shows all + pages"
    A4: "back button absent in widget"
    A5: "skip Agent2 on Agent1 no-op (~1s + $0.001 saving per turn)"

related_experts:
  - "engine-v5 — owns the visual_assembly tool's execution target; op vocabulary + preset names in prompt MUST match engine contract."
  - "catalog — postgres_catalog is data source for catalog_search; field_definitions feed Agent2 FIELDS prompt block."
  - "widget — consumes pipeline response (document + adjacentTemplates + entities). Shape changes cascade to frontend renderer."
  - "curator — reads v5_chat_session_traces for cross-tenant inspection; curator ChatsPage/ChatDetailPage depend on trace schema."
