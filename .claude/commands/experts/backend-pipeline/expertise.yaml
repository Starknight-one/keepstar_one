# Backend Pipeline Expertise (V4)
# LLM tools + system prompts for the two-agent pipeline.
# Agent1 retrieves data → Agent2 builds UI ops via visual_assembly → engine_v4 renders.

overview:
  layer: "pipeline"
  paths:
    tools: "project_v4/backend/internal/tools/"
    prompts: "project_v4/backend/internal/prompts/"
  go_module: "keepstar_v4"
  purpose: |
    Defines the LLM tool surface (4 tools) and the two system prompts (Agent1, Agent2)
    that drive the two-agent pipeline. Agent1 makes data decisions; Agent2 emits ops
    consumed by the V4 engine.

registry:
  file: "tool_registry.go"
  types:
    - "ToolContext { TenantSlug, SessionID, Trace, ... }  — request-scoped context threaded into Execute"
    - "ToolExecutor interface { Definition() domain.ToolDefinition; Execute(ctx, toolCtx, input) (*domain.ToolResult, error) }"
    - "Registry struct { tools map[string]ToolExecutor }"
  ctor: "NewRegistry(statePort, catalogPort, embeddingPort, eng *engine_v4.Engine, tenantPresets *engine_v4.TenantPresetLoader) *Registry"
  methods:
    - "Register(tool)"
    - "GetDefinitions() []domain.ToolDefinition"
    - "Execute(ctx, toolCtx, toolCall) (*domain.ToolResult, error)"
  registered_tools:
    - "catalog_search           (Agent1, public)"
    - "_internal_state_filter   (Agent1, public — _internal_ prefix means 'invisible to user UI', still called by LLM)"
    - "_internal_history_lookup (Agent1, public — same prefix convention)"
    - "visual_assembly          (Agent2, public)"
  not_registered:
    - "tool_search_products.go — legacy, NOT wired in NewRegistry. Safe to ignore until removed."

agent1:
  role: "Data Retrieval"
  prompt_file: "internal/prompts/prompt_analyze_query.go"
  prompt_const: "Agent1SystemPrompt"
  decision_tree:
    - "If user wants STYLE/DISPLAY change (e.g. 'убери описание', 'без цены') → call NO tool."
    - "If loaded_products>0 AND user wants SUBSET of current data → _internal_state_filter."
    - "Else if user wants products/services → catalog_search."
    - "If user references previous turns → _internal_history_lookup."
  catalog_block: "Pre-computed CatalogDigest is injected into the system prompt: category tree + enum filter values + price ranges (rubles)."
  state_block: "loaded_products / loaded_services counts injected so the LLM can choose filter vs search."
  language_rule: "vector_query keeps user's ORIGINAL language (no translation). filters use exact enum values from <catalog>."
  units: "Prices in RUBLES. 'дешевле 10000' → filters.max_price: 10000."

agent2:
  role: "UI Builder (ops only)"
  prompt_file: "internal/prompts/prompt_compose_widgets.go"
  prompt_const: "Agent2ToolSystemPrompt"
  output_contract: "Calls visual_assembly. Never outputs free text."
  required_param: "mode — REQUIRED. No default."
  modes:
    rebuild: "Discard previous formation, build fresh (preset or ops). Use when new data arrived or user asks for a different view."
    modify:  "Load existing formation, apply ops as deltas. Use when refining/tweaking the current view."
  pattern: |
    Build ONE widget template; engine clones it for N data items and binds field values.
    Agent2 NEVER produces N widgets for N items.
  composition: "Multi-widget compositions are supported (text_explainer above a product grid, etc.) — see prompt sections COMPOSING and MODIFYING EXISTING."

tools:

  catalog_search:
    file: "internal/tools/tool_catalog_search.go"
    name: "catalog_search"
    purpose: "Retrieve NEW data from catalog (products or services) via hybrid search."
    pipeline:
      - "1. SQL keyword search via catalog port (exact filter match)."
      - "2. pgvector semantic search via embedding port (if vector_query non-empty)."
      - "3. RRF merge — rrfMerge() blends keyword+vector by reciprocal rank fusion."
      - "4. Writes products/services to state.loaded_data + state.meta."
    inputs:
      entity_type: "product | service"
      filters:
        - "brand, category, product_form, skin_type, concern, key_ingredient, target_area, routine_step, texture"
        - "min_price, max_price (rubles)"
      vector_query: "free-text in user's original language"
    outputs: "ok | empty (data is written to state, not returned in tool_result body)"
    notes:
      - "rrfMerge() has a `hasFilters` flag — when filters present, keyword results weighted higher."
      - "Service search uses a smaller filter set (brand, category) — see svcVF construction."

  _internal_state_filter:
    file: "internal/tools/tool_state_filter.go"
    name: "_internal_state_filter"
    purpose: "Filter the data already in state (no DB roundtrip). Used when user asks for a subset of currently-loaded items."
    inputs:
      entity_type: "product | service"
      brand, category, text_match: "string"
      min_price, max_price: "rubles"
      min_rating: "number"
    outputs: "Filtered subset written back to state.loaded_data."
    naming_note: "_internal_ prefix is a UI convention (do not show in trace UI as a 'real' Agent1 action) but the LLM IS expected to call it."

  _internal_history_lookup:
    file: "internal/tools/tool_history_lookup.go"
    name: "_internal_history_lookup"
    purpose: "Read previous turns from session history (so Agent1 can answer 'about that previous one' style queries)."
    inputs:
      turn_offset: "negative int (-1 = last)"
      limit: "max turns to fetch"
    outputs: "Array of LLMMessage from session.ConversationHistory."

  visual_assembly:
    file: "internal/tools/tool_visual_assembly.go"
    name: "visual_assembly"
    purpose: "Agent2's only tool. Builds/modifies the formation tree by submitting ops to engine_v4."
    inputs:
      mode: "rebuild | modify (REQUIRED)"
      ops: "[]engine_v4.Op — array of operations"
      preset: "preset name (12 available — see engine-v4 expert)"
      layout: "grid | list | single | carousel"
      columns: "int"
      size: "tiny | small | medium | large"
      replicate: "bool — overrides preset.DefaultReplicate"
      limit: "int — cap on data items used for replication"
    execution:
      - "1. resolvePresetForTenant(tenantSlug, name) — KeepstarCanvas tenant override falls back to global registry."
      - "2. If mode=modify, load existing formation; if mode=rebuild, start fresh."
      - "3. validatePresetWithUserOps(presetName, ops) — sanity check ($refs in user ops match preset's exposed refs)."
      - "4. Engine.Execute(ExecuteInput{...}) — preset ops concatenated BEFORE user ops in the same batch."
      - "5. Returns formation + tree_map (compact ref structure for next-turn Agent2 context)."
    helpers:
      - "ProductToMap(p domain.Product) map[string]interface{} — flatten product for binding"
      - "ServiceToMap(s domain.Service) map[string]interface{} — flatten service"
      - "convertToFormation(data interface{}) *domain.FormationWithData — load/coerce existing formation"

prompt_caching:
  status: "Active — Anthropic prompt caching enabled on system+tools+conversation."
  ttl: "5 minutes (Anthropic default)."
  threshold: "Anthropic min for caching is 1024 tokens (Haiku 4.5). Both Agent1 + Agent2 system prompts comfortably exceed this — no padding tools needed."
  legacy_padding: "V1/V2 had GetCachePaddingTools() with ~20 _internal_ no-op tools. NOT present in V4 — do NOT reintroduce."

cost_model:
  default_model: "claude-haiku-4-5-20251001 (overridable via LLM_MODEL env var)."
  pricing_table: "domain.LLMPricing covers haiku-4-5, sonnet-4-5, opus-4-5, sonnet-3-5, haiku-3 (kept for back-compat)."
  cache_pricing:
    write: "1.25× base input price"
    read:  "0.1× base input price"
  cost_field: "domain.LLMUsage.CalculateCost() — writes USD into trace per turn."

cross_layer_callers:
  - "internal/usecases/agent1_execute.go → loops Agent1 LLM call + tool execution until stop."
  - "internal/usecases/agent2_execute.go → single visual_assembly call, then state write."
  - "internal/usecases/pipeline_execute.go → orchestrates Agent1 → Agent2 → return formation."
  - "internal/handlers/handler_pipeline.go → POST /api/v1/pipeline → calls pipeline_execute."

tracing:
  port: "ports.TracePort (postgres adapter persists for 48h)."
  spans:
    - "agent1.llm.ttfb / agent1.tool.<tool_name>"
    - "agent2.llm.ttfb / agent2.tool.visual_assembly"
  agent_trace_fields_of_note:
    - "PromptSent (full system prompt sent to Anthropic — for diff debugging)"
    - "RawResponse (raw Anthropic response — for tool_use shape debugging)"
    - "ToolBreakdown (per-tool Ms timings)"
  debug_endpoint: "GET /debug/traces/{id} → waterfall view (chat-backend port 8080)"

gotchas:
  - "Agent1 must NOT call any tool for STYLE requests ('убери описание', 'без цены'). Test cases live near top of Agent1SystemPrompt."
  - "_internal_ prefix on state_filter and history_lookup is intentional — the LLM still calls them; only the trace UI hides them as 'internal' actions."
  - "tool_search_products.go is NOT registered (orphan from older iteration). Don't add it to NewRegistry without explicit reason."
  - "visual_assembly requires explicit mode every turn. There is NO default — sending ops without mode is a hard error."
  - "Preset ops are concatenated BEFORE user ops in a single ApplyOps batch — so user ops can target $refs exposed by the preset, but NOT vice versa."
  - "When tenant has a published canvas preset for a name, resolvePresetForTenant returns the tenant version; otherwise falls back to global registry. Tenants can shadow but not unregister presets."
  - "Cost is computed AFTER each turn via LLMUsage.CalculateCost() — relies on PricingModel matching the actual model id, otherwise cost = 0 silently."
  - "Prices throughout this layer are RUBLES, but the catalog port stores master_products in KOPECKS (int). Conversion happens in postgres adapter, not here. See backend-domain expert."

related_experts:
  - "engine-v4 — what visual_assembly's ops do once they reach Engine.Execute. Read this before debugging Agent2 outputs."
  - "backend-usecases — agent1_execute, agent2_execute, pipeline_execute orchestrators."
  - "backend-domain — ToolDefinition, ToolCall, ToolResult, LLMMessage, LLMUsage, CatalogDigest shapes."
  - "backend-handlers — /api/v1/pipeline route, debug trace UI."

active_workstreams:
  tracker: "docs/PRE_LAUNCH_TASKS.md"
  notes: "Most active waves touching this layer: B2 (preset coverage), B4 (multi-widget cart totals), B7 (role-based field binding will reshape catalog_search filter set)."
