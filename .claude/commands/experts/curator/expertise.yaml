# Curator Expertise
# Standalone Go binary + React SPA for catalog curation. Read-side dashboard
# over the same Neon DB as admin + V5. The 6-step catalog flow (inbox →
# discovery_v2 → apply_v2) surfaces are read locally; sync-now is proxied to
# admin-backend's /admin/api/catalog/v2/sync-now.

overview:
  layer: "standalone-service"
  go_module: "keepstar-curator"
  imports: "keepstar-curator/internal/{adapters, domain, handlers, session} (no cross-module imports)"
  path: "curator/"
  purpose: |
    Operator dashboard for catalog curation, rebuilt 2026-05-15 around the
    6-step catalog flow. Surfaces (a) tenants dashboard with operations,
    (b) per-tenant catalog v2 tabs: inbox, action log, agent runs, mapping
    artifact, products listings, (c) master catalog browse + detail,
    (d) cross-tenant V5 chat/trace inspection, (e) audit log.
    Legacy candidate/junk/merge-report flows were removed with the catalog-v2
    cut-over.
  database: "Same Neon Postgres as admin/v5. CURATOR_DATABASE_URL or DATABASE_URL fallback."
  deployment: "Single binary multi-stage Dockerfile (mirrors project_admin pattern). One Railway service: Curator → curator-production-46d7.up.railway.app, branch main, rootDir /curator, port 8082."

architecture:
  pattern: "Hexagonal lite — single adapter package (postgres.go + v5_chats.go + catalog_v2.go), single handlers package, thin domain types"
  backend_structure:
    cmd_server: "curator/backend/cmd/server/main.go (185 LOC) — DI bootstrap, route mux, CORS, SPA fallback"
    cmd_seed: "curator/backend/cmd/seed-curator/main.go (49 LOC) — bootstrap default curator user"
    domain: "curator/backend/internal/domain/types.go (147 LOC) — read-shape types for catalog domain only. NOTE: v5 chat/trace types live in the adapters package (v5_chats.go), and catalog-v2 types (Inbox*, ActionLogEntry, AgentRun*, MappingArtifactView) live in adapters/catalog_v2.go — both deliberate exceptions for cross-domain read inspection."
    adapters_postgres: "curator/backend/internal/adapters/postgres.go (695 LOC) — primary Client struct: auth + audit + tenants + master catalog. Lost ~170 LOC with the 2026-05-15 purge (candidate/junk/promote methods removed); Group D 0.9.6 dropped the dead verticalTables/verticalKeys() helpers."
    adapters_catalog_v2: "curator/backend/internal/adapters/catalog_v2.go (240 LOC) — NEW 2026-05-15. Read methods for the 6-step flow: ListInbox, GetInboxItem, ListActionLog, ListAgentRuns, GetAgentRun, GetMappingArtifact. Reads catalog.inbox_items, admin.tenant_action_log, admin.agent_runs, catalog.tenant_catalog_schema."
    adapters_v5_chats: "curator/backend/internal/adapters/v5_chats.go (302 LOC) — V5 chat/trace read methods (Client.ListChats / GetChatTimeline / GetChatTurn). Reads tables OWNED by V5: v5_chat_sessions, v5_chat_session_traces. Curator never writes them."
    adapters_pending: |
      curator/backend/internal/adapters/pending.go (536 LOC, NEW 2026-05-20; expanded
      Alpha 0.9.4; rerouted Group D 0.9.6 2026-05-25). Read-shape: PendingTreeNode,
      PendingMasterCard, PendingChangeRow, PendingMasterDetail, ApplyChangesResult,
      ApproveResult. Read: ListPendingTree(vertical) → tree of master_categories with
      pending_master_count + pending_change_count via M:N master_product_categories.
      ListPendingMastersInCategory(catID, limit, offset). GetPendingMaster(id).
      Write: ApplyPendingChanges(changeIDs) — per-field router over
      PendingChangeRow.FieldName + OpKind. GROUP D 0.9.6: the 3 master_cosmetics
      allowlist maps (cosmeticsTextCols/IntCols/ArrayCols) + all master_cosmetics
      INSERT…ON CONFLICT SQL were DELETED (table dropped). Routes now: (1)
      masterProductTextCols → master_products.{name,brand,description,image_url,gtin}
      fill-when-empty UPDATE; (2) "tier2.<key>" prefix → master_products.tier2 jsonb —
      scalar fill-when-empty (`tier2 = COALESCE(tier2,'{}') || jsonb_build_object(key,val)`
      guarded WHERE tier2->key IS NULL/empty) or array set-union (jsonb_set + jsonb_agg
      DISTINCT; tolerates single-string pending_value since EnrichExistingMaster stages
      one element per row); (3) "tier3.<key>" prefix → master_products.tier3 jsonb merge.
      op_kind ('enrich_array_union' vs scalar) selects within tier2/tier3.
      BulkApproveMasters / BulkApprovePendingChanges / BulkRejectMasters /
      BulkRejectPendingChanges flip status flags.
      Companion regression test: regression_pending_apply_test.go (Alpha 0.9.4 A3).
    regression_tests: "curator/backend/internal/adapters/regression_pending_apply_test.go + regression_inbox_idempotency_test.go (admin side) lock the per-field router and identical-payload idempotency contracts."
    handlers: "curator/backend/internal/handlers/handlers.go (204 LOC) — auth + audit + tenants + master catalog HTTP handlers"
    handler_catalog_v2: "curator/backend/internal/handlers/handler_catalog_v2.go (119 LOC) — NEW 2026-05-15. Pure-read handlers for inbox/action-log/agent-runs/mapping tabs."
    handler_pending: |
      curator/backend/internal/handlers/handler_pending.go (~180 LOC, NEW
      Alpha 0.9.4). Wires GET /pending/tree, /pending/category/{id},
      /pending/master/{id}, POST /pending/approve, /pending/reject. ApprovePending
      runs ApplyPendingChanges → BulkApproveMasters → BulkApprovePendingChanges
      in that order (so "approved" implies "written"). decided_by from
      session.Email(ctx); falls back to literal "curator".
    handler_merge: "curator/backend/internal/handlers/handler_merge.go (113 LOC) — MergeProxy: single remaining endpoint HandleSyncNowV2 (→ /admin/api/catalog/v2/sync-now/{tenant_id})."
    handler_chats: "curator/backend/internal/handlers/handler_chats.go (88 LOC) — V5 chat inspection: ListChats / GetChatTimeline / GetChatTurn. Pure read; no proxy."
    session: "curator/backend/internal/session/middleware.go (94 LOC) — Bearer or HttpOnly Cookie auth, opaque tokens"
  frontend_structure:
    framework: "React 19 + Vite 7 + React Router 7"
    entry: "curator/frontend/src/main.jsx, App.jsx (95 LOC)"
    pages:
      - "LoginPage — POST /curator/auth/login, sets cookie + receives token"
      - "TenantsPage — GET /curator/tenants (operator dashboard)"
      - "TenantDetailPage (574 LOC) — 6-step catalog-v2 flow tabs: Products / Inbox / Action Log / Agent Runs / Mapping; Sync-now button"
      - "MasterCatalogPage / MasterDetailPage — master catalog browse"
      - "PendingPage (326 LOC, NEW Alpha 0.9.4) — pending-approval review at /pending; tree (by vertical) → category cards → master detail with PendingChangeRow list; approve/reject calls POST /curator/pending/{approve,reject}. Sidebar 'Pending Approval' link under Operations."
      - "AuditPage — audit log read-only"
      - "ChatsPage (155 LOC) — cross-tenant V5 chat session list with filters (tenant, status, q) + aggregates (cost/tokens/turn count)"
      - "ChatDetailPage (207 LOC) — session timeline + spans waterfall for one V5 chat turn"
    removed_2026_05_15: "CandidatesPage, JunkPage, MergeReportPage; sidebar Curation Queues section."
    api_client: "curator/frontend/src/api.js (58 LOC) — fetch wrapper, no hard redirect on 401 (App.jsx handles via setUser(null))"
    styling: "curator/frontend/src/app.css + styles/tokens.css; design tokens via CSS variables."

domain_types:
  file: "curator/backend/internal/domain/types.go"
  philosophy: "Read-shape only. Curator does NOT own canonical catalog domain — admin owns it. Keep types here narrow, JSON-exact for the operator UI."
  cross_package_types:
    - "ChatRow, ListChatsFilter, TurnSummary, ChatTimeline, TurnDetail live in adapters/v5_chats.go — V5 owns the shape, Curator renders it"
    - "InboxRow, InboxItemFull, ActionLogEntry, AgentRunSummary, AgentRunDetail, MappingArtifactView live in adapters/catalog_v2.go — admin owns the catalog-v2 shape"
    - "PendingTreeNode, PendingMasterCard, PendingChangeRow, PendingMasterDetail, ApplyChangesResult, ApproveResult live in adapters/pending.go — curator owns this surface (it's the only domain where curator MUTATES catalog.*) but the read shape mirrors catalog.master_pending_changes + master_products approval columns. Writes target master_products columns + tier2/tier3 jsonb only (master_cosmetics gone, Group D 0.9.6)"
  types:
    - "CuratorUser {ID, Email, Role string, CreatedAt} — Role default 'curator' (DB column DEFAULT 'curator')"
    - "AuditEntry {ID, TenantID, ActorKind, ActorID, EntityKind, EntityID, Action, FieldChanges, AggregateMeta, CreatedAt}"
    - "IntegrationSummary {Kind, Status, DisplayName, ExternalID, LastSyncAt}"
    - "TenantSummary {ID, Slug, Name, Type, ProductsCount, MasterLinkedCount, MasterLinkCoverage, Integrations, SchemaStatus, SchemaVersion, CreatedAt}"
    - "TenantProductRow {ID, Name (COALESCE display_name/original_name/name), OriginalName, SKU, Brand, PriceCents, Currency, Stock, ImageURL, HasMasterLink, MasterID, SourceSystem}"
    - "MasterProductSummary {ID, Name, Brand, Vertical, HasEmbedding, HasPIM, HasDescription, ListingCount, OwnerTenantSlug, ImageURL, CreatedAt}"
    - "MasterVariantSummary {ID, SKU, GTINs, Color, Size, Material, WeightG, VolumeML, ImageURL}"
    - "MasterProductDetail (embeds MasterProductSummary) {Description, PIMFields, Variants, LinkedListings}"
    - "TenantSchemaSummary {TenantID, Status, ArtifactVersion, DiscoveredAt, ValidatedAt, MappingArtifact, ValidationReport}"
  dead_types:
    - "AttributeCandidate, CategoryCandidate, JunkCandidate — types remain in types.go for backwards-compat but no adapter/handler/page references them after 2026-05-15. Safe to delete on next sweep."

http_routes:
  public:
    - "GET  /health → 'ok'"
    - "POST /curator/auth/login → {token, user} + sets curator_session cookie"
    - "POST /curator/auth/logout → clears cookie + invalidates token"
  protected:
    description: "All wrapped in session.Middleware(client). Reject 401 if no Bearer header AND no curator_session cookie."
    me: "GET /curator/me → {id, email, role}"
    audit:
      - "GET /curator/audit?limit=N → AuditEntry[]"
    tenants:
      - "GET  /curator/tenants → TenantSummary[]"
      - "GET  /curator/tenants/{id} → TenantSummary"
      - "GET  /curator/tenants/{id}/products?search=...&limit=...&offset=... → {rows: TenantProductRow[], total: int}"
      - "GET  /curator/tenants/{id}/schema → TenantSchemaSummary"
      - "POST /curator/tenants/{id}/sync-now → MergeProxy.HandleSyncNowV2 → admin /admin/api/catalog/v2/sync-now/{tenant_id}"
      - "GET  /curator/tenants/{id}/inbox?limit=&offset= → {items: InboxRow[], total} — catalog.inbox_items list"
      - "GET  /curator/tenants/{id}/inbox/{itemID} → InboxItemFull — full raw JSONB payload"
      - "GET  /curator/tenants/{id}/action-log?limit=&offset= → {items: ActionLogEntry[], total} — admin.tenant_action_log timeline"
      - "GET  /curator/tenants/{id}/agent-runs?limit=&offset= → {items: AgentRunSummary[], total} — admin.agent_runs list"
      - "GET  /curator/tenants/{id}/agent-runs/{runID} → AgentRunDetail — full tools_called + tokens + cost"
      - "GET  /curator/tenants/{id}/mapping → {exists, artifact?} — current mapping artifact JSONB from catalog.tenant_catalog_schema; shape is version-tagged (v1/v2/v3 since 2026-05-15 evening). Body is opaque to curator — UI must inspect `version` to render."
    master_catalog:
      - "GET /curator/master/products?vertical=...&search=...&limit=...&offset=... → {rows: MasterProductSummary[], total: int}"
      - "GET /curator/master/products/{id} → MasterProductDetail"
    chats:
      - "GET /curator/chats?tenant=&status=&q=&limit=&offset= → {sessions: ChatRow[], total, hasMore} — cross-tenant V5 session list with filters; status='active' if updated_at within last 30min, else 'closed'"
      - "GET /curator/chats/{sessionId} → ChatTimeline {session, turns[], totalCostUsd, totalTokens} — session header + ordered turns (oldest first)"
      - "GET /curator/chats/{sessionId}/turns/{requestId} → TurnDetail {turn, spans[]} — full spans JSONB for waterfall view"
      - "Dispatch in main.go: /curator/chats/ prefix routes to GetChatTurn if path contains '/turns/', else GetChatTimeline (single mux entry, two handlers)"
    pending:
      - "GET  /curator/pending/tree?vertical=... → {vertical, categories: PendingTreeNode[], count} — master_categories tree with pending_master + pending_change counts via M:N"
      - "GET  /curator/pending/category/{id}?limit=&offset= → {category_id, cards: PendingMasterCard[], total} — masters in 'pending_approval' OR with ≥1 pending change, newest first"
      - "GET  /curator/pending/master/{id} → PendingMasterDetail — card + every PendingChangeRow attached"
      - "POST /curator/pending/approve {master_ids?, change_ids?, reason?} → {masters_updated, changes_updated, changes_applied, changes_skipped, decided_by} — runs ApplyPendingChanges FIRST (writes target columns), then BulkApproveMasters, then BulkApprovePendingChanges. decided_by = session.Email(ctx)"
      - "POST /curator/pending/reject {master_ids?, change_ids?, reason?} → {masters_updated, changes_updated, decided_by} — pure status flip; no column writes"
  spa_fallback:
    pattern: "Any path that doesn't resolve to a static file under CURATOR_STATIC_DIR (default ./static) → serve index.html"
    rationale: "Standard SPA deep-link support so /tenants/abc/merge-reports/xyz works after page refresh"

session_auth:
  scheme: "Opaque random tokens. Plaintext sent to client (cookie + JSON), SHA-256 hashed at rest in DB."
  token_storage:
    where: "DB (curator.sessions table — schema 'curator', owned by adapters.postgres RunMigrations)"
    cookie:
      name: "curator_session"
      path: "/"
      http_only: true
      secure: "controlled by CURATOR_COOKIE_SECURE env (true for prod)"
      same_site: "Lax"
      max_age: "7 * 24 * 3600  (7 days)"
    bearer: "Authorization: Bearer <token> — supported for API/non-browser clients"
  middleware: "session.Middleware(client) — wraps all protected routes. Sets ctx values (uid, email, role) via context.WithValue."
  context_helpers: "session.UserID(ctx), session.Email(ctx), session.Role(ctx)"
  resolve_session: "adapters.Client.ResolveSession(ctx, plain) → CuratorUser; ErrInvalidCredentials if not found"
  logout: "Both cookie and Bearer paths: client.Logout(token) deletes server-side row, then ClearCookie sets MaxAge=-1"

merge_proxy:
  file: "curator/backend/internal/handlers/handler_merge.go (113 LOC)"
  pattern: "Thin HTTP forwarder. After catalog-v2 cut-over (2026-05-15), only HandleSyncNowV2 remains (legacy merge/discover/report routes deleted)."
  why: "Keep catalog-v2 logic in admin-backend (single source of truth). Cross-module proxy avoids code duplication and drift."
  flow:
    - "1. Curator-frontend → curator-backend with curator_session cookie"
    - "2. session.Middleware authenticates → sets ctx.UserID"
    - "3. MergeProxy attaches X-Internal-Key + X-Curator-User: <uid>"
    - "4. POST to admin-backend internal endpoint behind internalMW"
    - "5. admin-backend's InternalKeyMiddleware accepts header → UpdateOrchestrator.ManualSync → returns ApplyResult JSON"
    - "6. MergeProxy pipes response back to curator-frontend (synchronous)"
  admin_internal_endpoints:
    - "POST /admin/api/catalog/v2/sync-now/{tenant_id} — UpdateOrchestrator.ManualSync; runs synchronously (~10s on 10-product smoke)"
  config_env:
    - "ADMIN_BASE_URL — admin-backend base (default http://127.0.0.1:8081 for local dev)"
    - "CURATOR_INTERNAL_KEY — must match admin's CURATOR_INTERNAL_KEY env var; empty → 503 from proxy"
  timeouts:
    client_timeout: "10 minutes — covers worst-case discovery_v2 (10 min wallclock budget) cascading from a first_install ManualSync"
    rationale: "On a fresh tenant ManualSync may trigger discovery_v2 (10 min budget). Curator UI must not bail before that — would burn LLM tokens with no result surfaced."
  body_limit: "8 MiB request body cap (LimitReader) — sync-now body is tiny but the proxy is generic."

adapter_methods:
  files:
    - "curator/backend/internal/adapters/postgres.go (695 LOC)"
    - "curator/backend/internal/adapters/catalog_v2.go (240 LOC)"
    - "curator/backend/internal/adapters/v5_chats.go (302 LOC)"
  groups:
    auth:
      - "CreateUser(ctx, email, password) — bcrypt hashed; returns user ID"
      - "Login(ctx, email, password) → (token, user, err) — verifies bcrypt, generates session, persists hashed token"
      - "Logout(ctx, plain) — deletes session by hashed token"
      - "ResolveSession(ctx, plain) → CuratorUser — middleware entry point"
    audit:
      - "ListAudit(ctx, limit)"
      - "WriteAudit(ctx, e) — kept for future operator actions; no internal caller after 2026-05-15"
    tenants:
      - "ListTenants(ctx) — TenantSummary[] (joins tenants + products counts + master link coverage + integrations + schema status)"
      - "GetTenant(ctx, id)"
      - "ListTenantProducts(ctx, tenantID, search, limit, offset) → ([]row, total)"
      - "GetTenantSchema(ctx, tenantID)"
      - "listIntegrationsForTenants(ctx, tenantIDs) — internal helper, batched lookup"
    master_catalog:
      - "ListMasterProducts(ctx, vertical, search, limit, offset) → ([]row, total)"
      - "GetMasterProduct(ctx, id) → MasterProductDetail (with variants + linked listings)"
    catalog_v2:
      file: "catalog_v2.go"
      methods:
        - "ListInbox(ctx, tenantID, limit, offset) → ([]InboxRow, total) — reads catalog.inbox_items; ORDER BY fetched_at DESC; includes applied_at NULL filter as a flag, not a hard filter"
        - "GetInboxItem(ctx, itemID) → *InboxItemFull — single row with full raw JSONB payload"
        - "ListActionLog(ctx, tenantID, limit, offset) → ([]ActionLogEntry, total) — reads admin.tenant_action_log; ORDER BY occurred_at DESC"
        - "ListAgentRuns(ctx, tenantID, limit, offset) → ([]AgentRunSummary, total) — reads admin.agent_runs; ORDER BY started_at DESC"
        - "GetAgentRun(ctx, runID) → *AgentRunDetail — full tools_called JSONB + tokens_in/out + cost_usd"
        - "GetMappingArtifact(ctx, tenantID) → *MappingArtifactView{Status, ArtifactVersion, Body json.RawMessage, DiscoveredAt, ValidatedAt} — current artifact body from catalog.tenant_catalog_schema; Body is pass-through JSONB (v1/v2/v3 since 2026-05-15 evening); nil when no row. Status enum now includes 'active' (replaced 'validated' admin-side)."
    v5_chats:
      file: "v5_chats.go"
      methods:
        - "ListChats(ctx, ListChatsFilter) → ([]ChatRow, total) — dynamic WHERE; aggregates from v5_chat_session_traces (turn_count, total_cost, total_tokens, has_errors, last_trace_at); latest user_query via DISTINCT ON; LEFT JOIN catalog.tenants for slug/name; status derived by 30-min cutoff on s.updated_at"
        - "GetChatTimeline(ctx, sessionID) → ChatTimeline — header from v5_chat_sessions; turns ordered ASC; populates session aggregates from accumulator"
        - "GetChatTurn(ctx, sessionID, requestID) → TurnDetail — full row + spans JSONB unmarshalled to []json.RawMessage for waterfall"
    pending:
      file: "pending.go"
      methods:
        - "ListPendingTree(ctx, vertical) → []PendingTreeNode — master_categories filtered by vertical; correlated subqueries against master_product_categories + master_pending_changes for the two counts"
        - "ListPendingMastersInCategory(ctx, categoryID, limit, offset) → ([]PendingMasterCard, total) — masters with approval_status='pending_approval' OR ≥1 pending change"
        - "GetPendingMaster(ctx, masterID) → *PendingMasterDetail — card + PendingChangeRow[] joined from master_pending_changes"
        - "ApplyPendingChanges(ctx, changeIDs) → ApplyChangesResult{Applied, Skipped} — fetches rows, routes by FieldName + OpKind. GROUP D 0.9.6 routes: masterProductTextCols allowlist (name/brand/description/image_url/gtin) + 'tier2.<key>' prefix (jsonb scalar-fill or array-union) + 'tier3.<key>' prefix. The 3 master_cosmetics allowlists were removed (table dropped). Unknown fields counted as Skipped (no error). Each route executes one SQL with fill-when-empty semantics."
        - "BulkApproveMasters(ctx, masterIDs, decidedBy) → ApproveResult — UPDATE approval_status='approved', approved_at=NOW(), approved_by"
        - "BulkApprovePendingChanges(ctx, changeIDs, decidedBy) → ApproveResult — UPDATE master_pending_changes status='approved'. MUST run AFTER ApplyPendingChanges in the same handler."
        - "BulkRejectMasters / BulkRejectPendingChanges — pure status flips to 'rejected' with reason"
  utility:
    - "generateSessionToken() — crypto/rand 32-byte token"
    - "hashToken(plain) — SHA-256 hex"
  sql_identifier_safety:
    note: |
      GROUP D 0.9.6: the only remaining fmt.Sprintf-into-SQL path is the
      masterProductTextCols allowlist (5 fixed columns on master_products) —
      column names are physically only that map's keys, so a malicious
      field_name cannot reach a dynamic identifier. The tier2.<key> and
      tier3.<key> routes are NOT dynamic identifiers: <key> is passed as a
      parameterized jsonb path/key ($2), never interpolated into the SQL
      string — so arbitrary keys are safe by construction. The 3 master_cosmetics
      allowlists (cosmeticsTextCols/IntCols/ArrayCols) and their fmt.Sprintf
      INSERT templates were deleted with the table. postgres.go also dropped the
      dead verticalTables/verticalKeys() helpers in the same commit. Adding a
      new fixed master_products column still requires extending masterProductTextCols;
      new typed attrs need NO allowlist change (they ride the tier2.<key> route).
  removed_2026_05_15:
    - "Candidate queues (ListAttributeCandidates, ListCategoryCandidates, PromoteAttribute, DismissAttribute)"
    - "Junk classification (ListJunkCandidates, ClassifyJunk)"
    - "SQL identifier safety helpers (verticalKeys, verticalTables, allowedColumnTypes, validIdent) — superseded by hardcoded column allowlists in pending.go"

frontend:
  router_v7: "react-router-dom 7"
  layout: "App.jsx Layout component — sidebar (Operations [Tenants, Master Catalog, Pending Approval], Activity [Audit], Tracing [Chat Sessions] sections) + main route outlet. Curation Queues section removed 2026-05-15."
  auth_flow:
    - "On mount: GET /curator/me. 401 → setUser(null) → render LoginPage. Success → render Layout."
    - "LoginPage onLogin sets user, navigates to /tenants"
    - "Logout: POST /curator/auth/logout, setUser(null), navigate('/login')"
  redirects:
    - "Logged-out: /* → Navigate('/login')"
    - "Logged-in /login → Navigate('/tenants')"
    - "Logged-in / → Navigate('/tenants')"
    - "Logged-in /* (unknown) → Navigate('/tenants')"
  api_client:
    file: "src/api.js (58 LOC)"
    methods: "api.get(path), api.post(path, body), etc."
    base_url: "VITE_CURATOR_API env or relative"
    cookie_handling: "credentials: 'include' on every fetch (required for cross-origin dev with curator_session cookie)"

env_vars:
  required:
    - "CURATOR_DATABASE_URL (or fallback DATABASE_URL) — Postgres DSN"
  optional:
    - "PORT — Railway-injected listening port; CURATOR_BIND overrides; default :8082"
    - "CURATOR_COOKIE_SECURE=true — set Secure on session cookie (prod only)"
    - "CURATOR_CORS_ORIGIN — explicit allow-list for dev frontend (Vite on :5175). No `*` wildcard."
    - "CURATOR_STATIC_DIR — SPA static path, default ./static"
    - "ADMIN_BASE_URL — for MergeProxy, default http://127.0.0.1:8081"
    - "CURATOR_INTERNAL_KEY — shared secret with admin-backend's CURATOR_INTERNAL_KEY"

deploy:
  dockerfile: "curator/Dockerfile (multi-stage: node22 frontend build → golang1.24 backend → alpine3.21 runtime)"
  service_name: "Curator (Railway)"
  domain: "curator-production-46d7.up.railway.app"
  exposed_port: 8082
  static_serving: "./static directory copied from frontend/dist; serves index.html for SPA paths"
  branch: "main"
  rootDirectory: "/curator (Railway setting)"

invariants:
  - "Curator domain types are READ-shape only EXCEPT for the pending-approval surface (PendingTreeNode et al. in adapters/pending.go) — admin owns canonical catalog domain. Adding new types here means duplicating, fix at admin first."
  - "MergeProxy never executes business logic — pure HTTP forwarder. Adding mutating ops means add to admin-backend internal endpoint, not curator."
  - "Curator MUTATES catalog.* ONLY via ApplyPendingChanges + the bulk approve/reject helpers in adapters/pending.go (Alpha 0.9.4 A3; rerouted Group D 0.9.6). Writes target master_products.{name/brand/description/image_url/gtin}, master_products.tier2 (jsonb, replaced master_cosmetics), master_products.tier3, plus the master_pending_changes + master_products status columns. No other catalog mutation path exists in curator; no ALTER TABLE on any path."
  - "Session tokens are HASHED at rest (SHA-256). Plaintext only travels in HTTP layer (cookie/Bearer/login response)."
  - "Sidebar nav order: Operations (tenants, master, pending approval) > Activity (audit) > Tracing (chats). Curation Queues section was removed with the candidate/junk purge; Pending Approval added Alpha 0.9.4."
  - "Login does NOT auto-create users — seed-curator command bootstraps the first admin user. New users come via admin-managed flow."
  - "Curator uses its own 'curator' schema in Postgres (curator.users, curator.sessions) — separate from admin.* and catalog.* schemas. RunMigrations creates it idempotently on startup."

gotchas:
  - "Sync-now is synchronous — admin's ManualSync runs inline and the response is the ApplyResult JSON. On a fresh tenant it may cascade into discovery_v2 (10 min budget). The curator client timeout is 10 minutes; UI should show a spinner, not a stuck button."
  - "Curator and admin share the same Postgres but different schemas — curator reads from admin.*, catalog.*, and V5 chat tables; never mutates them. After 2026-05-15 there are zero ALTER TABLE call sites in curator."
  - "Cookie SameSite=Lax means cross-origin POSTs from curator UI to curator backend MUST share parent domain in prod. CURATOR_CORS_ORIGIN allow-list is for dev only (Vite :5175 → 8082). In prod, frontend and backend share host."
  - "ADMIN_BASE_URL has no health check — if admin is down, MergeProxy returns the raw fetch error. No circuit breaker or retry."
  - "Curator has no tests (`*_test.go` count: 0). Adding tests is a known gap; for now any change relies on integration testing against live admin/V5 stack."
  - "TenantProductRow.Name uses COALESCE(display_name, original_name, name) — listing rename via admin's editing UI changes display_name only; original is retained."
  - "V5 chat tables (v5_chat_sessions, v5_chat_session_traces) are READ-ONLY from Curator. V5 backend writes them best-effort async; missing turns aren't a Curator bug — could be V5 trace writer dropped them."
  - "ChatRow.Status is computed in code, not a DB column: time.Since(LastActivityAt) <= 30min → 'active'. The same 30-min cutoff is duplicated in the SQL WHERE for status filter — if you change one, change both (adapters/v5_chats.go ListChats, const cutoff = '30 minutes')."
  - "/curator/tenants/ and /curator/chats/ prefix dispatchers in main.go branch on path suffix/substring. Adding a new sub-resource means adding another switch case — the StripPrefix mux trick isn't used here. The tenants dispatcher now has 8 branches (products/schema/sync-now/inbox/inbox-detail/action-log/agent-runs/agent-run-detail/mapping); easy to break ordering."
  - "extractTenantSegment in handler_catalog_v2.go assumes path shape /curator/tenants/{id}/{suffix} — if a new path segment (like a UUID with embedded slashes) ever appears, the helper will mis-extract. Same gotcha applies to GetTenantInboxItem / GetTenantAgentRun which index parts[4] explicitly."
  - "AttributeCandidate / CategoryCandidate / JunkCandidate types still live in domain/types.go but no code references them. They look live to anyone grepping the domain package — they are dead code from before 2026-05-15."
  - "ApplyPendingChanges is NOT wrapped in a Begin/Commit in pending.go — each per-field UPDATE/INSERT is its own statement. The handler's 3-step sequence (apply → approve masters → approve changes) is therefore non-atomic: a crash between steps 1 and 3 leaves changes written but status still 'pending'. The next approve call is idempotent on writes (fill-when-empty) so re-running closes the gap, but a single approve isn't all-or-nothing."
  - "ApplyPendingChanges silently counts unknown field_name as Skipped (not error). GROUP D 0.9.6: typed per-vertical attrs now arrive as 'tier2.<key>' and ride the generic tier2 jsonb route (no allowlist needed). The only remaining hard allowlist is masterProductTextCols (5 fixed columns). A bare cosmetic field_name (e.g. 'skin_type' without the 'tier2.' prefix) would now be Skipped — admin's enrich builder must emit the tier2.<key> form. Keep the prefix contract in lockstep with admin's apply_v2.cosmeticsToMap (which emits tier2.<key>)."

related_experts:
  - "admin — owns canonical catalog domain types, UpdateOrchestrator, ApplyV2, DiscoveryV2. Curator UI is a thin operator surface over admin's data + endpoints. Sync-now proxy targets admin's /admin/api/catalog/v2/sync-now/."
  - "catalog (cross-cutting) — inbox_items / master_products (incl. tier2/tier3 jsonb) / tenant_catalog_schema / agent_runs / tenant_action_log; curator reads these via SQL through its own Client. master_cosmetics was DROPPED Group D 0.9.6 — curator's pending-apply writes tier2 instead."
  - "pipeline-agents — NOT directly related to curator's catalog tabs, but curator's /chats endpoints consume the v5_chat_sessions/traces tables pipeline-agents writes."

