read_side_v5:
  file: "project_v5/backend/internal/adapters/postgres/postgres_catalog.go + postgres_catalog_vector.go"
  adapter: "CatalogAdapter"
  GROUP_D_REPOINT_DONE: "Alpha 0.9.10 (2026-05-26, f9516ca) FIXED the Group-D breakage. All three dropped objects are gone from V5 SQL: (1) master_cosmetics → mp.tier2 jsonb (tier2String/tier2Strings populate the legacy cosmetics-shaped domain.Product fields); (2) catalog.categories + mp.category_id → master_product_categories junction (catalogCategoryJoin LATERAL pick + EXISTS-subquery filters); (3) catalog.stock → p.stock_quantity. The shared SELECT column list catalogVectorSelect lives in postgres_catalog_vector.go and is scanned by the single scanCatalogProduct; ListProducts/VectorSearch/SearchProjection each build only the FROM/JOIN tail."
  read_methods:
    - "GetTenantBySlug(ctx, slug) — filters deleted_at IS NULL"
    - "ListProducts(ctx, tenantID, ProductFilter) → ([]Product, total, error) — FROM products LEFT JOIN master_variants/master_products + catalogCategoryJoin; predicates built by catalogFilterConditions (tier2/junction); multi-word query OR-matches on (name, brand) via ILIKE"
    - "VectorSearch(ctx, tenantID, embedding, limit, *VectorFilter) — INNER JOIN master_products (embedding NOT NULL), ORDER BY mp.embedding <=> $2; reuses catalogFilterConditions. RETAINED for non-projection callers; catalog_search no longer uses it (uses SearchProjection)"
    - "SearchProjection(ctx, tenantID, embedding []float32, ProductFilter, limit) → []Product — NEW 0.9.10. The SINGLE read catalog_search uses. CTE 'ranked' over catalog.tenant_search_projection: score = cosine(1-(tsp.embedding<=>$2)) [when embedding non-nil] + ts_rank(tsp.search_tsv, plainto_tsquery('simple',$3)) [when filter.Search non-empty]; WHERE embedding-present OR fts-empty OR search_tsv@@query; other filter fields narrow via catalogFilterConditions; then hydrates display cols from canonical tables via scanCatalogProduct. embedding may be nil → FTS-only graceful degradation. Replaces the old keyword(ListProducts)+vector(VectorSearch)+RRF merge."
    - "GetProduct(ctx, tenantID, productID) — same JOIN shape; calls mergeProductWithMaster"
    - "BuildCatalogDigest(ctx, tenantID) → *CatalogDigest — 0.9.10: category tree via master_product_categories→master_categories junction; shared filters = global distinct values from tier2 jsonb (jsonb_array_elements_text guarded by jsonb_typeof='array'); cached in tenants.catalog_digest JSONB; consumed by Agent1 system prompt"
  internal_helpers:
    - "mergeProductWithMaster(p *Product, mp masterProductRow) — listing-as-overrides COALESCE(listing.field, master.field); unmarshals mp.tier2 into p.Tier2; tier2String/tier2Strings derive p.ProductForm/Texture/RoutineStep/MarketingClaim/SkinType/Concern/KeyIngredients/TargetArea/Benefits from tier2 keys (non-cosmetics verticals leave them empty)."
    - "catalogFilterConditions(filter, args, argNum) → (conditions, args, argNum) — shared predicate builder used by ListProducts + VectorSearch + SearchProjection. Scalars (product_form/routine_step/texture) via mp.tier2->>'k'=$; arrays (skin_type/concern/key_ingredients/target_area) via mp.tier2->'k' @> to_jsonb($::text); categories via master_product_categories EXISTS-subqueries."
    - "tier2String(m,key)→string / tier2Strings(m,key)→[]string — read scalar/array attrs out of the decoded tier2 map."

