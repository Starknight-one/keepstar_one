invariants:
  - "catalog.tenants soft-delete (2026-05-13): deleted_at IS NULL = active. ALL queries joining or filtering catalog.tenants must include this predicate. GetTenantBySlug and ListForUser already updated."
  - "catalog.* schema is owned by admin migrations — V5 is a READER. New tables/columns added via project_admin migrations only."
  - "products.master_product_id is NULLable — un-linked listings exist legitimately (pre-apply state)."
  - "VectorSearch HNSW index requires non-NULL embedding — listings without embedding are invisible to vector search (keyword/trigram still works)."
  - "apply_v2 is the ONLY path that writes master_products + tier2 + listings (incl. default-variant binding) from inbox. Tier3 absorbs anything unknown (vertical not modeled, unmapped target prefix with valid '.', or cosmetics-fields-but-not-cosmetics-vertical)."
  - "Alpha 0.9.10 search projection: catalog.tenant_search_projection holds ONLY search texts + embedding + tsvector — price/stock/images/rating are NOT stored there; SearchProjection hydrates them at read time from canonical tables. A price/stock change therefore does NOT need a re-embed. RebuildSearchProjection ON CONFLICT keeps the existing embedding via COALESCE(EXCLUDED.embedding, …) so an FTS-only rebuild (no embedder) never clobbers vectors written by an earlier embedded run. The projection is a DERIVED slice: rebuilding it is always safe; cmd/build-projection recomputes the whole tenant. apply rebuilds only the batch's masters and is best-effort (a failed rebuild leaves stale/missing rows but never fails apply)."
  - "GROUP D 0.9.6: tier2 jsonb on master_products is the SOLE canonical home for typed per-vertical attributes (vertical-agnostic — cosmetics has no special table). master_cosmetics + 16 legacy typed columns (incl. enrichment_version) DROPPED. apply_v2 writes tier2 via BulkMergeTier2. Valid keys per vertical declared in master_field_definitions (18 cosmetics keys seeded). NEVER add a per-vertical typed table (master_electronics etc.) — it goes in tier2."
  - "Alpha 0.9.10 CHANGED V5 tier surfacing: the SELECT now exposes mp_tier2 = COALESCE(mp.tier2,'{}') — tier3 is NO LONGER COALESCEd ahead of tier2 into p.Tier2 (was COALESCE(mp.tier3, mp.tier2) pre-0.9.10). tier3 still contributes to SEARCH via the projection's tier3_text column, but typed tier2 attrs surfaced to the chat come from tier2 only. tier3 = search-soup / provenance; tier2 = typed vertical attrs."
  - "master_products is IMMUTABLE on bind (2026-05-15 evening). MatchOrCreateMaster either inserts a fresh row OR returns the existing id untouched. Apply_v2 only writes Tier2/tier3 when wasCreated=true. 2026-05-20: on bind, apply_v2 ALWAYS calls EnrichExistingMaster (one EnrichRequest per inbox row) — proposed scalar fills + array-union elements land in catalog.master_pending_changes for curator approval. Per-tenant marketing differences will live in listing.tenant_overrides (column reserved 2026-05-15; first writer not wired yet)."
  - "Pending-approval staging (2026-05-20): new masters insert with approval_status='pending_approval' + pending_approval_expires_at=NOW()+30d when mp.CreateAsPending=true. Apply_v2 sets CreateAsPending=true unconditionally. Existing legacy rows default to 'approved'. The pending_approval state is INVISIBLE to V5 read-side TODAY (no WHERE approval_status='approved' predicate in postgres_catalog.go) — adding the filter is a downstream follow-up. Curator sweeper transitions pending+expired → 'expired' and emits AuditActionExpire."
  - "EnrichExistingMaster dedup: same (master_id, field, op_kind, pending_value) with status='pending' is filtered via NOT EXISTS at INSERT — re-applying identical inbox rows produces zero new pending entries. Empty-target gating ('fill scalar only when current is NULL/''', 'array union only NEW elements') is enforced at APPROVE time, NOT write time: caller stages everything safely; curator UI shows what would actually change on approval."
  - "Match cascade is strict-exact only — SKU (lowercased) → GTIN (digits-only) → normalized_match_key (NFKC-strip-collapse-lower). The pg_trgm GIN indexes on brand/name exist for FUTURE curator fuzzy search and are NOT consulted by apply_v2."
  - "NormalizeMatchKey (Go) and the catalog_migrations backfill (SQL REGEXP_REPLACE) MUST produce byte-identical output. Changing one without the other corrupts stage-3 matching."
  - "Shopify webhook handler MUST call client.VerifyWebhookHMAC BEFORE processing — only enforced call site is handler_integrations_shopify.go:159. Webhook body must be detached onto a fresh context.WithTimeout (r.Context cancels at handler return)."
  - "DiscoveryV2 hard budgets: 30 turns, 10 min wallclock, $5 USD, 10 peek_full_rows. At 90% of $ budget the loop forces a commit-on-next-turn nudge. Hitting any cap → finalStatus='budget_exhausted' and no artifact persisted."
  - "DiscoveryV2 target prefixes are CLOSED set: master.<col>, cosmetics.<col>, tier3.<key>. Cosmetics is the ONLY typed vertical with a Tier-2 table; any other vertical's typed attributes go to tier3. Agent prompt forbids inventing prefixes like 'electronics.cpu' but apply_v2 forgivingly reroutes to tier3 with a warn if it sees them."
  - "ShopifyV2UseCase.inboxIngester is REQUIRED — SetInboxIngester must be called by main.go DI; nil → panic on first ingest. Legacy harvester-lite fallback was removed 2026-05-15."
  - "apply_v2 mapping_miss cap is 3 narrow discovery triggers per ApplyForTenant call — prevents runaway agent loops when artifact is fundamentally broken."
  - "UpdateOrchestrator.OnWebhook 24h rate-limit: webhooks within window are absorbed into inbox but NOT applied. ManualSync bypasses. Curator 'Sync now' uses ManualSync. products/delete webhook bypasses the orchestrator entirely (SoftDeleteListing path)."
  - "tenant_catalog_schema.status is now 'active'|'stale'|'needs_human_review' (was 'validated' pre-2026-05-15 evening). Curator UI and any new reader must accept 'active'."
  - "MappingArtifactV3.ClassifyingField (NEW 2026-05-20): apply_v2.classifyContextFromRaw reads raw[art.ClassifyingField] as the primary ProductType signal; falls back to {product_type, productType, primary_category, category, type, kind, department} synonyms when artifact is legacy (V2-lifted) or field is empty. classify_rules' DSL still references signal names {product_type, brand, name, tag} regardless of the underlying column — the DSL is bound to ClassifyContext fields, not to literal raw keys. Discovery_v2 commit_artifact REQUIRES this field; dispatcher smoke-tests classify against PeekFullRows(5)."
  - "Discovery_v2 must call MASTER-side tools (list_master_categories, digest_master_category) BEFORE finalizing field_map (system prompt enforces Step 2 = look at master catalog FIRST). The agent should mirror our existing taxonomy, not invent parallel structures. MasterDigestPort.ListMasterCategories joins through M:N (master_product_categories) — schema change to that table will alter all 5 digest tool outputs."
  - "InboxPort.BulkUpsert is the seed/scale path; Upsert is the per-row error-attribution path. WriteFromShopifyBulk + writeFromMapRows USE BulkUpsert. ShopifyV2.UpdateOrchestrator.OnWebhook still uses Upsert per-row (single-product event). Don't replace Upsert call sites with BulkUpsert in the per-webhook path."
  - "CronDailySourcePull is OFF by default. Enable with KEEPSTAR_DAILY_SOURCE_PULL=1. main.go starts the ticker only when both the env var = '1' AND catalogV2Orchestrator != nil (i.e. AnthropicAPIKey was configured at boot). Dev/test runs naturally stay off so they don't burn tokens nightly."
  - "ApplyForTenant is BULK since Alpha 0.9.3 (2026-05-22): applyOne is pure (no DB writes) and returns a preparedApply struct; the use case collects a full inbox page then issues ~10 bulk writes (BulkMatchOrCreateMaster, BulkMergeTier2, BulkMergeTier3, EnrichExistingMaster, BulkUpsertListing, BulkMarkApplied). Per-row port methods stay live for tests and the single-product webhook path. Don't add a per-row write inside applyOne — it will execute outside the page transaction shape and break the page-level idempotency the bulk path provides."
  - "Discovery_v2 is a BUILDER since Alpha 0.9.2 (2026-05-21): the single commit_artifact JSON-blob terminal is gone. The agent must call set_classifying_field, add_branch, add_field_mapping, add_classify_rule (with optional remove_*/inspect_draft) and finalize with 'commit'. Each builder call validates against the cached inbox shape, the allowlisted master/cosmetics target columns (sourced from domain reflection), and transform/target type compatibility — invalid args return tool_error and the agent self-corrects in the same run within the $5 budget. New target columns added to master_products/master_cosmetics MUST be reflected in the allowlist or builder will reject them."
  - "Transform empty-input tolerance (Alpha 0.9.2): numeric, int, ml_from_string, g_from_string return (nil, nil) on empty or whitespace input. apply_v2.applyOne treats nil as 'no value' and drops the rule for that row — NO mapping_miss. Required side effect: optional numeric fields (Sephora sale_price_usd, child_min_price; any partially-populated CSV) no longer kill apply. If you add a new numeric-ish transform, mirror the same (nil,nil)-on-empty contract."

gotchas:
  - "V5 read-side does NOT filter by approval_status today (2026-05-20). New masters inserted as 'pending_approval' are still visible to V5 chat. The intended invariant (approved-only on read) requires updating postgres_catalog.go ListProducts/GetProduct/BuildCatalogDigest WHERE clauses + VectorSearch — follow-up work."
  - "Bind-path enrich is fire-and-forget from apply_v2's perspective: even if EnrichExistingMaster inserts 0 rows (dedup or empty payload), the inbox row still gets applied_at=NOW() and the listing upsert runs. Don't gate listing writes on enrich return count — they're independent."
  - "Legacy harvester_lite, discovery_agent, merge_apply, match_cascade, junk_detector, validate_artifact and their tests/ports/adapters were DELETED 2026-05-15 (commit 62a2e36). Any code or doc referencing them is stale."
  - "MappingArtifactV2 is no longer the in-memory type — apply_v2 reads V3 only. V1/V2 JSONB still readable: adapter PeekArtifactVersion dispatches and LiftV2ToV3 wraps a V2 into a single-branch V3 in memory. Writes always emit V3. Don't write new code against V1 or V2 types directly."
  - "Per-row vertical classification cascade (alias → rules → 'unknown'). The alias table is catalog.vertical_aliases (lowercase PK). The rules DSL is tiny — anything outside the four supported predicates is silently treated as no-match. Parse failures don't surface at row time; the artifact-build pass is supposed to validate syntax once."
  - "MatchOrCreateMaster returns wasCreated. Apply_v2 uses it as the SINGLE gate for Tier 2 + tier3 writes. A future code path that writes Tier 2 on bind would silently corrupt other tenants' chat (their catalog reads the same master). Don't add such a path without a curator workflow review."
  - "GTIN field name aliasing: assignMasterField accepts gtin / barcode / ean / upc and stripGTIN normalizes to digits-only. Adding a new alias (e.g. ISBN) requires updating BOTH this switch and the agent's prompt examples."
  - "NormalizeMatchKey unicode: uses \\p{L}\\p{N} (any-script letter/number). Cyrillic, Greek, CJK characters all preserved. The Postgres backfill must use a compatible character-class — pg_trgm collation handles this in Neon today; check before migrating clusters."
  - "vertical_aliases is seeded with ~45 starter aliases (cosmetics/haircare/electronics/furniture/apparel/footwear/ski). Missing aliases fall through to classify_rules then 'unknown' — fix path is INSERT INTO vertical_aliases (curator UI planned)."
  - "GROUP D Task #7 (Alpha 0.9.7, commit ff1241f): the dead master_cosmetics code is now REMOVED — UpsertCosmetics/BulkUpsertCosmetics/bulkUpsertCosmeticsBatch/probeCosmeticsSchema, ports.{UpsertCosmetics,BulkUpsertCosmetics,BulkCosmeticsItem,ErrCosmeticsSchemaNotReady}, MasterVariantsAdapter.{Upsert,Get}MasterCosmetics, and domain.MasterCosmetics all deleted (0 grep hits; the 'errors'/'sync' imports they kept alive were removed too). KEEP ports.MasterCosmeticsUpsert — distinct type, apply_v2 fills it in-memory then cosmeticsToMap → tier2 patch."
  - "apply_v2 forgiving fallback (commit 8ddaaa5 + 2026-05-15 evening rebuild): unknown vertical prefix 'foo.bar' → tier3.bar with warn; cosmetics.* inside a non-cosmetics branch → tier3.<col> with warn. Neither surfaces a mapping_miss; data isn't lost but lives under a flat tier3 key. Branch missing entirely → mapping_miss with synthetic key 'branch.<vertical>' triggers narrow discovery_v2."
  - "discovery_v2 nudge mechanism: when the model emits text-only end_turn without calling commit_artifact, the loop injects a user message demanding a commit and retries up to 3 times before failing. If you see 'model ended turn without committing artifact after 3 nudges' in logs, the system prompt isn't routing the model to the tool."
  - "discovery_v2 cost accounting uses claude-sonnet-4-6 pricing constants (sonnet46InputUSDPer1M etc). Refresh these if Anthropic changes pricing — overestimate stops runs early; underestimate blows the budget."
  - "Inbox payload_hash dedup: WriteFromShopifyBulk returns 'unchanged' counts. Don't bump applied_at on unchanged rows or you'll re-process steady-state inventory daily."
  - "UpdateOrchestrator.OnWebhook calls inbox.WriteManual with the entire webhook body — even for products/<verb> Shopify events. ShopifyIngester.IngestSingleWebhook wraps OnWebhook; if you wire a raw webhook directly to OnWebhook, the JSONB shape differs from bulk JSONL (single-product Shopify REST shape vs GraphQL bulk node shape)."
  - "agent_runs.tools_called is appended via JSONB concatenation (no full-array rewrite) so concurrent reads stay safe during a live run."
  - "catalog.tenant_catalog_schema.mapping_artifact stores v1, v2, AND v3 artifacts (cross-revision) — distinguish by artifact_version column or by inspecting the JSON's 'version' field (1, 2, or 3). v3 (NEW 2026-05-15 evening) has 'branches:[{vertical, field_map:[]}]' + 'classify_rules:[]' instead of a single flat 'field_map'."
  - "extractTier2 / match_cascade / Tier1 promotion are all GONE. Curator's PromoteAttribute still exists but flows through master_field_definitions INSERT (no ALTER TABLE on master_products). See curator expert."
  - "Shopify webhook MUST detach from r.Context() — handler_integrations_shopify.go:169 uses context.WithTimeout(context.Background(), 5*time.Minute) inside the goroutine. Using r.Context() will fail with 'context canceled' the moment the handler writes its 200 response."

