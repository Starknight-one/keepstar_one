# Catalog Expertise
# Cross-cutting domain: write side in admin (project_admin/), read side in V5
# (project_v5/). Same Postgres schema (catalog.*). Pipeline (rebuilt 2026-05-14):
# source → inbox_items → discovery_v2 → apply_v2 → master_products (+ tier2 typed attrs
# + tier3 fallback) + slim listings. 2026-05-15 structured-discovering-lollipop rebuild:
# MappingArtifactV3 (multi-vertical branches + classify_rules), deterministic SKU→GTIN→
# NormalizedMatchKey cascade, masters IMMUTABLE on bind, products/delete soft-delete.
# [0.9.1–0.9.5 condensed — FULL detail in active_workstreams.recent_milestones]
# 0.9.1 ClassifyingField + master-side discovery tools + pending-approval staging + bulk
# upserts + CronDailySourcePull. 0.9.2 builder-pattern discovery + transform empty-tolerance.
# 0.9.3 bulk apply (~2000→~10 roundtrips). 0.9.4 lower_sku idx + BulkMarkApplied + patch-from-
# existing. 0.9.5 (B2) apply publishes DriftJob to Redis stream; DRIFT_WORKERS classify unmapped
# fields → schema_drift_findings + admin Drift tab (REDIS_URL empty → schemaDrift nil, no-op).
# GROUP D Phase 1 (2026-05-25, owner-approved destructive, RUN ON NEON — FULL detail in
# active_workstreams.recent_milestones; PIM table phase now STRUCTURALLY COMPLETE). Net effect:
# tier2 jsonb is the SOLE vertical-agnostic home for typed attrs; master_cosmetics + 16 legacy
# typed cols + catalog.services/master_services + catalog.categories(V1) + master_products.category_id
# + catalog.stock ALL DROPPED. 0.9.6 (ef3c6c2) tier2-canonical + drop services; 0.9.7 (ff1241f)
# Task#7 dead-cosmetics-code removed + D3 categories→master_product_categories junction; 0.9.8
# (22d9f26) D4 stock→products.stock_quantity; 0.9.9 (870ae5c) D1b variant=listing (every listing
# bound to a master_variant NOT NULL; variant_kind +'default'; real sibling grouping DEFERRED).
# 0.9.10 (f9516ca): SEARCH LAYER + V5 REPOINT — the Group-D V5 breakage is now FIXED.
#   New catalog.tenant_search_projection (per-tenant denormalized slice: PK(tenant_id,
#   master_variant_id), *_text cols + embedding vector(384) + search_tsv; price/stock/images
#   hydrated at read time). New pure internal/searchtext pkg assembles vertical-agnostic
#   combined text. Writer.RebuildSearchProjection (apply hot path passes batch masterIDs;
#   CLI cmd/build-projection passes nil = whole tenant) + SetEmbedder (OpenAI, nil→FTS-only).
#   V5 read-side repointed OFF the 3 dropped objects → tier2 (cosmetics attrs), master_categories
#   junction (categories), p.stock_quantity (stock); new CatalogPort.SearchProjection (fused
#   cosine+ts_rank over the slice) is the SINGLE read catalog_search now uses (RRF/parallel
#   keyword+vector path deleted). Verified on Neon: 1963/1963 rows embedded, hybrid live.
#   DEFERRED still: D6 vocab (no consumer), real sibling grouping. Spec: docs/CATALOG_GROUP_D_SPEC.md
#   (spec §2.0 prose is stale on master_cosmetics phasing — trust the migration, not the prose).

overview:
  cross_cutting: true
  write_side:
    path: "project_admin/backend/internal/{adapters/postgres, adapters/shopify, usecases, handlers}/"
    go_module: "keepstar-admin"
    purpose: "Ingest sources → catalog.inbox_items (raw JSONB) → DiscoveryV2 (Sonnet 4.6) produces MappingArtifactV2 → ApplyV2 writes master_products + per-vertical (master_cosmetics) + tier3 + slim catalog.products listings."
  read_side:
    path: "project_v5/backend/internal/adapters/postgres/postgres_catalog.go (+ postgres_catalog_vector.go)"
    go_module: "keepstar-v5"
    purpose: "Serve catalog reads to V5 chat pipeline (ListProducts, GetProduct, BuildCatalogDigest, VectorSearch, SearchProjection). Alpha 0.9.10: vertical-agnostic — typed attrs from mp.tier2, categories via master_product_categories junction, stock from p.stock_quantity; catalog_search reads the per-tenant tenant_search_projection slice via SearchProjection (fused cosine+FTS)."
  curator_side:
    path: "curator/backend/internal/adapters/postgres.go"
    purpose: "Read-only browse + manual sync trigger. Legacy candidate/junk/merge-report flows deleted with catalog-v2 rebuild. See `curator` expert."
  database: "Single Neon Postgres. catalog.* schema (data) + admin.* schema (operational tables: agent_runs, tenant_action_log)."

schema:
  schemas: ["catalog.*", "admin.* (operational)"]
  core_tables:
    catalog_tenants: "tenants {id, slug, name, type, settings JSONB, catalog_digest JSONB, created_at, updated_at, deleted_at TIMESTAMPTZ NULL} — soft-delete added 2026-05-13; NULL=active."
    catalog_categories_DROPPED: "categories (V1 single-table tree) — DROPPED 2026-05-25 (Alpha 0.9.7, D3, DROP TABLE CASCADE on Neon). V2 set is canonical: master_categories + master_product_categories (M:N) + tenant_categories + category_mapping. master_products.category_id column also DROPPED — product↔category link now lives ONLY in master_product_categories. V5 read-side repointed to the junction in Alpha 0.9.10 (catalogCategoryJoin LATERAL pick) — no longer broken."
    catalog_master_product_categories: "master_product_categories {master_product_id FK→master_products, master_category_id FK→master_categories} — M:N junction; one master can sit in many categories. Canonical product↔category link since D3 (replaces dropped master_products.category_id). idx_catalog_mpc_category(master_category_id). Read via LATERAL join (catalog_adapter ListProducts/GetProduct pick name LIMIT 1) + recursive-CTE category filter over master_categories. MasterDigestPort joins through here too."
    catalog_master_products: |
      master_products {id, sku UNIQUE, name, description, brand, images JSONB,
      owner_tenant_id, embedding vector(384), vertical TEXT NOT NULL DEFAULT 'cosmetics',
      tier2 JSONB, tier3 JSONB NOT NULL DEFAULT '{}', confidence TEXT (unverified|reviewed|approved),
      source_system, source_id, gtin TEXT NULL, normalized_match_key TEXT NULL,
      approval_status TEXT NOT NULL DEFAULT 'approved' CHECK ∈ {approved|pending_approval|rejected|expired},
      pending_approval_expires_at TIMESTAMPTZ NULL, approved_at TIMESTAMPTZ NULL, approved_by TEXT NULL,
      created_at, updated_at}.
      NEW 2026-05-15 (evening): gtin + normalized_match_key feed the MatchOrCreateMaster cascade.
      NEW 2026-05-20: approval_status + pending_approval_expires_at + approved_at + approved_by —
      first apply for a tenant inserts master as pending_approval with NOW()+INTERVAL '30 days';
      existing rows default to 'approved' so migration is non-disruptive.
      GROUP D 2026-05-25 (Alpha 0.9.6): the 16 legacy typed columns are GONE
      (skin_type/concern/key_ingredients/target_area/free_from/benefits TEXT[],
      marketing_claim/how_to_use/product_form/texture/routine_step/routine_time/
      application_method/original_name/product_line/enrichment_version) — backfilled into
      tier2 (cosmetic attrs) / tier3 (provenance) then DROP COLUMN. tier2 jsonb is now the
      SOLE canonical home for typed per-vertical attributes; valid keys per vertical declared
      in master_field_definitions. NOTE volume_ml/weight_g/unit_count/scent/spf were never
      master_products columns (they lived on the dropped master_cosmetics) — they too land in tier2.
      GROUP D 2026-05-25 (Alpha 0.9.7): category_id column DROPPED — product↔category link moved to
      the master_product_categories junction.
    catalog_master_pending_changes: |
      master_pending_changes {id UUID, master_product_id FK→master_products ON DELETE CASCADE,
      op_kind TEXT CHECK ∈ {enrich_array_union|enrich_scalar_fill}, field_name TEXT,
      pending_value JSONB, source_inbox_item_id FK→inbox_items ON DELETE SET NULL,
      tenant_id FK→tenants ON DELETE CASCADE,
      status TEXT DEFAULT 'pending' CHECK ∈ {pending|approved|rejected|expired},
      created_at, expires_at TIMESTAMPTZ DEFAULT NOW()+INTERVAL '30 days',
      decided_at, decided_by, decided_reason}. NEW 2026-05-20. Bind-path enrichment staging:
      apply_v2.EnrichExistingMaster writes one row per (master,field,value) — empty-target
      gating is at APPROVE time, not write time. Sweeper transitions status='pending' with
      expires_at < NOW() to 'expired'.
    catalog_master_cosmetics_DROPPED: |
      master_cosmetics — DROPPED 2026-05-25 (Alpha 0.9.6 Group D, DROP TABLE CASCADE on Neon).
      Was {master_product_id PK, skin_type/concern/key_ingredients/target_area/free_from/benefits
      TEXT[], product_form, texture, routine_step, routine_time, application_method, scent, spf INT,
      marketing_claim, how_to_use, volume_ml, weight_g, unit_count, extra JSONB}. All 1000 rows
      backfilled into master_products.tier2. apply_v2 now writes tier2 via BulkMergeTier2.
      V5 read-side repointed to mp.tier2 in Alpha 0.9.10 (tier2String/tier2Strings populate
      the legacy cosmetics-shaped domain.Product fields from tier2; distinct-filter query reads
      tier2 jsonb keys) — no longer broken.
    catalog_master_variants: "master_variants {id, master_product_id FK, sku, gtins TEXT[], image_url, weight_g, volume_ml, length_mm/width_mm/height_mm, color, size, material, axes JSONB, variant_kind (default|real|addon|bundle), weight_raw, volume_raw, parse_status JSONB, embedding vector(384)}. GROUP D 2026-05-25 (Alpha 0.9.9, D1b table phase): variant=listing model — every catalog.products listing now bound to a master_variant; a simple product gets one synthetic variant_kind='default'. variant_kind CHECK gained 'default'; default treated like real for search (only addon/bundle excluded). apply UpsertListing/BulkUpsertListing now ensure-default-then-bind (apply_v2 still never writes typed variant attrs). Real sibling grouping (7ml+12ml→1 master, N variants) DEFERRED to agents phase. UpsertMasterVariant + FindByGTIN/FindByVendorAndSKU/FindByVendorAndFuzzyName/FindByEmbedding still exposed; UpsertMasterCosmetics/GetMasterCosmetics REMOVED (Task #7)."
    catalog_products: |
      products (listings) {id, tenant_id FK, master_product_id FK NULL, master_variant_id FK NULL,
      name (legacy), display_name, original_name, description, price INT cents, currency,
      master_variant_id NOT NULL (Alpha 0.9.9 — bound to master's variant, prefer default),
      stock_quantity, rating, raw_attributes JSONB, media JSONB, source_system, source_id,
      payload_hash, tags JSONB, tenant_overrides JSONB DEFAULT '{}', deleted_at, created_at, updated_at}.
      NEW 2026-05-15 (evening): tenant_overrides reserved for per-tenant marketing fluff
      (hot-sale badges, custom images, video links) — column added; first writer wired later.
      GROUP D 2026-05-25 (Alpha 0.9.8, D4 Target A): the offer = (price, currency, stock_quantity)
      is single-homed on this listing row. catalog.stock table + dead `reserved` col DROPPED;
      stock_quantity is the SOLE stock home. BulkUpdateStock UPDATEs this column (was INSERT
      catalog.stock); ListProducts/GetProduct/curator read p.stock_quantity directly.
      GROUP D 2026-05-25 (Alpha 0.9.9): master_variant_id is now NOT NULL (every listing bound).
    catalog_tenant_search_projection: |
      tenant_search_projection {tenant_id FK→tenants, master_variant_id FK→master_variants ON DELETE CASCADE,
      master_product_id FK→master_products ON DELETE CASCADE, vertical TEXT, tier1_text, tier2_text, tier3_text,
      variant_text, override_text TEXT, embedding vector(384) NULL, search_tsv tsvector, updated_at,
      PRIMARY KEY(tenant_id, master_variant_id)}. NEW 2026-05-26 (Alpha 0.9.10). Per-tenant DENORMALIZED
      search slice: ONE row per (tenant, master_variant). Carries search texts + embedding + tsvector ONLY —
      price/stock/images/rating are hydrated at READ time from the canonical tables (catalog.products etc.),
      so a price/stock change does NOT force a re-embed. Built by Writer.RebuildSearchProjection (apply hot
      path + cmd/build-projection backfill). search_tsv = to_tsvector('simple', combined search text). Read by
      V5 CatalogPort.SearchProjection (fused cosine + ts_rank). embedding NULL when no OPENAI_API_KEY → FTS-only.
    catalog_inbox_items: |
      inbox_items {id, tenant_id FK, source_kind CHECK ('shopify'|'csv'|'sheets'|'manual'),
      external_id, raw JSONB, payload_hash, fetched_at, applied_at TIMESTAMPTZ NULL}.
      UNIQUE(tenant_id, source_kind, external_id). GIN(raw). Partial idx on (tenant_id) WHERE applied_at IS NULL.
      Universal raw-buffer for the 6-step flow; any source writes here; discovery_v2 reads via narrow tools; apply_v2 consumes applied_at IS NULL rows.
    catalog_tenant_catalog_schema: "tenant_catalog_schema {tenant_id PK, mapping_artifact JSONB, artifact_version, status (active|stale|needs_human_review), discovered_at, validated_at, validation_report JSONB, re_discover_after} — now stores MappingArtifactV2 (version=2)."
    catalog_master_categories: "master_categories {id, parent_id (self-ref), slug UNIQUE, name, vertical, created_at} — global curated taxonomy."
    catalog_tenant_categories: "tenant_categories {id, tenant_id, parent_id, external_id, slug, name, kind (category|showcase|promo)} — tenant's own category tree; UNIQUE(tenant_id, external_id) WHERE external_id NOT NULL."
    catalog_category_mapping: "category_mapping {tenant_category_id PK, master_category_id NULL, confidence, mapped_by} — N:1 link."
    catalog_master_field_definitions: "master_field_definitions {id, vertical, key, label, type (text|number|enum|array|boolean), enum_values TEXT[], source (seed|curator|migration), promoted_from_candidate, promoted_at, promoted_by, UNIQUE(vertical,key)} — declarative tier2 schema; curator promotes via INSERT here (no ALTER TABLE). GROUP D 2026-05-25: migration seeds 18 cosmetics keys (source='migration', promoted_by='groupd') as the tier2 allowlist for the cosmetics vertical — these are the canonical replacement for the dropped master_cosmetics columns."
    catalog_ingredients_and_links: "ingredients {id, inci_name, name_ru, slug UNIQUE, function} + product_ingredients M:N {master_product_id, ingredient_id, position, is_key}."
    catalog_shopify_raw_imports: "shopify_raw_imports {tenant_id, source_kind, source_id, payload JSONB, fetched_at, PK(tenant_id,source_kind,source_id)} — high-tide staging for bulk pulls (legacy; v2 path skips this and writes inbox_items directly)."
    catalog_audit_log: "audit_log {id BIGSERIAL, tenant_id NULL, actor_kind, actor_id, entity_kind, entity_id, action, field_changes JSONB, aggregate_meta JSONB, created_at}."
    catalog_unit_aliases: "unit_aliases {id, tenant_id NULL=global, raw_token, canonical_unit, confidence, source, UNIQUE(tenant_id,raw_token)} — English-only seed (ml/g/oz/mm/in/pcs)."
    catalog_vertical_aliases: |
      vertical_aliases {alias TEXT PK (lowercased), vertical TEXT NOT NULL, source DEFAULT 'seed', created_at}.
      NEW 2026-05-15 (evening). Shopify product_type → internal vertical class lookup; seeded with ~45 starter aliases
      across cosmetics, haircare, electronics, furniture, apparel, footwear, ski. apply_v2 ClassifyVertical hits this
      table first (alias source), falls back to artifact classify_rules, then 'unknown'. Curator-editable later.
    catalog_api_keys: "api_keys {id, tenant_id, key_hash bcrypt, key_prefix, label, last_used_at, revoked_at, created_at} — public REST API auth."
    catalog_schema_drift_findings: |
      schema_drift_findings {id UUID, tenant_id FK→tenants ON DELETE CASCADE, apply_run_id TEXT,
      field_name TEXT, type_guess TEXT, stats JSONB, decision TEXT CHECK ∈
      {typo_of_existing|alias_of_attribute|new}, confidence NUMERIC(3,2),
      suggested_action JSONB, status TEXT DEFAULT 'pending' CHECK ∈
      {pending|classified|applied|dismissed}, created_at, classified_at,
      decided_at, UNIQUE(tenant_id, apply_run_id, field_name)}. NEW 2026-05-22
      (Alpha 0.9.5 — B2). One row per unmapped inbox field per apply run;
      SchemaDrift worker writes it; admin Drift tab reads + decides.
    admin_tenant_action_log: |
      admin.tenant_action_log {id BIGSERIAL, tenant_id FK→catalog.tenants ON DELETE CASCADE,
      action TEXT, status TEXT, payload JSONB, occurred_at}. NEW 2026-05-14. Per-tenant timeline
      surfaced in curator's "Action Log" tab. Distinct from catalog.audit_log (cross-tenant operator actions).
      Actions: inbox_pull|discovery_start|discovery_done|apply|webhook_received|manual_sync|mapping_miss|disconnect…
    admin_agent_runs: |
      admin.agent_runs {id UUID, tenant_id FK, trigger TEXT (first_install|manual|mapping_miss),
      trigger_payload JSONB, started_at, finished_at, status (running|success|failed|budget_exhausted),
      tools_called JSONB (appended), tokens_in/out, cost_usd NUMERIC(10,4), artifact_id}. NEW 2026-05-14.
      One row per DiscoveryV2 invocation; curator's "Agent Runs" tab reads from here.
  candidate_tables:
    master_attribute_candidates: "master_attribute_candidates {id, key, vertical, seen_in_tenants, sample_values JSONB, proposed_type, agent_meta, embedding vector(384), status (pending|promoted|dismissed|merged), merged_into_key, promoted_to_column, UNIQUE(key,vertical)} — promote → INSERT master_field_definitions."
    master_category_candidates: "master_category_candidates {id, name, proposed_parent, seen_in_tenants, vertical, status, promoted_to_id}."
    tenant_variant_candidates_junk: "tenant_variant_candidates_junk {id, tenant_id, listing_id, master_variant_id NULL, detected_reason JSONB, classification (pending|confirmed_addon|false_positive), classified_at, classified_by} — kept for forward compat; legacy junk_detector deleted."
  relations:
    - "products.tenant_id → tenants.id (FK, required)"
    - "products.master_product_id → master_products.id (NULLable — un-linked listings exist)"
    - "master_variants.master_product_id → master_products.id"
    - "inbox_items.tenant_id → tenants.id ON DELETE CASCADE"
    - "agent_runs.tenant_id → catalog.tenants.id ON DELETE CASCADE (cross-schema FK)"
    - "tenant_action_log.tenant_id → catalog.tenants.id ON DELETE CASCADE"
  indexes:
    - "HNSW on master_products.embedding (pgvector cosine)"
    - "HNSW on master_variants.embedding (master_services.embedding GONE — table dropped Group D)"
    - "GIN on master_products.tier2 (idx_master_products_tier2_gin) — now the only home for cosmetic-attr filters; per-key functional indexes added at promotion time"
    - "GIN on inbox_items.raw"
    - "Trigram GIN on master_products.name (idx_catalog_mp_name_trgm) — pg_trgm extension"
    - "Trigram GIN on master_products.brand, master_products.name (idx_master_products_brand_trgm, idx_master_products_name_trgm) — 2026-05-15 (evening) for future curator fuzzy search; NOT used by strict-exact MatchOrCreateMaster cascade"
    - "Partial idx_master_products_gtin(gtin) WHERE gtin IS NOT NULL (2026-05-15) — stage 2 of match cascade"
    - "Partial idx_master_products_normalized_match_key(normalized_match_key) WHERE normalized_match_key IS NOT NULL (2026-05-15) — stage 3 of match cascade"
    - "Functional idx_master_products_lower_sku ON master_products(LOWER(sku)) WHERE sku IS NOT NULL AND sku <> '' (2026-05-22, Alpha 0.9.5) — stage 1 of BulkMatchOrCreateMaster cascade JOIN; replaces full-table scan that dominated apply throughput"
    - "Partial UNIQUE idx_inbox_items_unique_source(tenant_id,source_kind,external_id)"
    - "Partial idx_inbox_items_tenant_unapplied(tenant_id) WHERE applied_at IS NULL"
    - "Partial idx_catalog_tenants_deleted_at WHERE deleted_at IS NOT NULL (2026-05-13)"
    - "Partial idx_catalog_products_tenant_source_unique(tenant_id,source_system,source_id) WHERE source_*  NOT NULL"
    - "Partial idx_catalog_products_active(tenant_id, master_product_id) WHERE deleted_at IS NULL (2026-05-15)"
    - "Partial idx_agent_runs_status_running(tenant_id) WHERE status='running'"
    - "idx_master_pending_changes_master_status(master_product_id, status) (2026-05-20)"
    - "idx_master_pending_changes_tenant_status(tenant_id, status) (2026-05-20)"
    - "Partial idx_master_pending_changes_expires(expires_at) WHERE status='pending' (2026-05-20) — sweeper hot path"
    - "Partial idx_master_products_pending_approval(approval_status, pending_approval_expires_at) WHERE approval_status='pending_approval' (2026-05-20)"
    - "idx_schema_drift_findings_tenant_status(tenant_id, status) (2026-05-22) — drives admin Drift tab list query"
    - "idx_catalog_mpc_category(master_category_id) ON master_product_categories (2026-05-25, D3) — category-filter join after V1 categories drop"
    - "Partial UNIQUE idx_catalog_mv_one_default(master_product_id) WHERE variant_kind='default' (2026-05-25, D1b) — at most one default variant per master; also the ON CONFLICT arbiter for ensure-default"
    - "catalog.stock + idx_catalog_stock_tenant DROPPED 2026-05-25 (D4 Target A) — stock_quantity lives on catalog.products"
    - "HNSW idx_tsp_embedding ON tenant_search_projection USING hnsw(embedding vector_cosine_ops) (2026-05-26, 0.9.10) — semantic side of SearchProjection"
    - "GIN idx_tsp_search_tsv ON tenant_search_projection USING gin(search_tsv) (2026-05-26, 0.9.10) — full-text side of SearchProjection; plus idx_tsp_master_product(master_product_id) for prune/rebuild by master set"
  pgvector:
    extension: "CREATE EXTENSION IF NOT EXISTS vector"
    dim: 384
    operator: "<=> (cosine distance)"
  extensions: ["vector", "pg_trgm"]

write_side_pipeline:
  description: |
    Rebuilt 2026-05-14 (commit 67e9f94). Replaces legacy 5-stage pipeline
    (harvest → discovery → validate → merge → curator approval) with a
    leaner 4-step loop. Legacy code purged 2026-05-15 (commit 62a2e36).
  stages:
    1_ingest:
      sources:
        - "Shopify OAuth bulk → ShopifyIngester.IngestBulkItems → InboxUseCase.WriteFromShopifyBulk"
        - "Shopify webhook (products/<verb>) → ShopifyIngester.IngestSingleWebhook → UpdateOrchestrator.OnWebhook"
        - "CSV upload → CSVIngester.IngestReader → InboxUseCase.WriteFromCSV"
        - "Sheets / manual → InboxUseCase.WriteFromSheets / WriteManual"
      files:
        - "internal/usecases/ingest_shopify.go — ShopifyIngester {IngestBulkItems, IngestSingleWebhook}"
        - "internal/usecases/ingest_csv.go — CSVIngester {IngestReader}"
        - "internal/usecases/inbox.go — InboxUseCase {WriteFromShopifyBulk, WriteFromCSV, WriteFromSheets, WriteManual}; computes payload_hash (SHA-256 canonical JSON)"
      writes_to: "catalog.inbox_items (raw JSONB, source_kind, external_id, payload_hash). Idempotent via UNIQUE(tenant_id, source_kind, external_id) — re-pulls of unchanged payloads return 'unchanged' and don't reset applied_at."
    2_discovery_v2:
      file: "internal/usecases/discovery_v2.go (546 LOC) + discovery_v2_tools.go (812 LOC) + discovery_v2_draft.go (506 LOC, NEW 2026-05-21)"
      use_case: "DiscoveryV2.Discover(ctx, tenantID, trigger, triggerPayload) → *MappingArtifactV3. Constructor 2026-05-20 takes (llm, inbox InboxPort, digest MasterDigestPort, artifact, actionLog, agentRuns, log) — digest may be nil only in tests."
      model: "claude-sonnet-4-6 (was Haiku in legacy DiscoveryAgent)"
      triggers: |
        ['first_install', 'manual', 'mapping_miss', 'unknown_vertical', 'manual_drift_apply'] —
        payload shape depends on trigger; mapping_miss carries {inbox_item_id, offending_from,
        offending_to, reason}; unknown_vertical carries {missing_vertical, sample_inbox_item_id}
        so the agent can add a new branch to the artifact; manual_drift_apply (NEW 2026-05-22,
        Alpha 0.9.5) is emitted by handler_schema_drift.Apply with payload {drift_finding_id,
        field_name, type_guess, suggested_action} so discovery_v2 patches the artifact to
        cover the unmapped field (rides B1 patch-from-existing path).
      budgets:
        max_turns: 30
        wallclock: "10 minutes"
        cost_usd: "$5.00 hard cap (claude-sonnet-4-6 pricing)"
        heavy_tools_cap: "10 peek_full_rows calls / run"
        force_finalize_threshold: "90% of $ budget → nudge model to commit on next turn"
      tools_offered:
        inbox_side:
          - "count_total — row count, no args"
          - "list_fields — distinct top-level JSONB keys, default limit 100"
          - "sample_values — distinct stringified values of ONE field"
          - "count_by — value→count distribution, top-N buckets"
          - "field_stats — non_null/distinct/samples/min/max/length"
          - "peek_full_rows — HEAVY, 1-5 raw rows (capped)"
        master_side_NEW_2026_05_20:
          - "list_master_categories(vertical, limit≤500, default 200) — taxonomy nodes + product_count per cat"
          - "digest_master_category(category_id) — name + vertical + product_count + top 10 brands + 10 recent names"
          - "find_master_by_sku(sku) — MasterRef or null (case-insensitive)"
          - "find_master_by_gtin(gtin) — MasterRef or null (exact)"
          - "list_master_brands_in_category(category_id, limit≤100, default 30) — top brands desc"
        builder_2026_05_21:
          - "set_classifying_field(field) — pick & validate the inbox category key; field must exist in cached inbox shape"
          - "add_branch(vertical) — declare a vertical branch; vertical must match closed set used by ClassifyVertical"
          - "add_field_mapping(vertical, from, to, transform, default) — one rule; validates from (Levenshtein suggestions if typo), to (allowlist of master.*/cosmetics.*/tier3.*), transform/target compatibility"
          - "add_classify_rule(when, then_vertical) — DSL: product_type|brand|name|tag (contains|=) X; rejects unsupported predicates"
          - "remove_field_mapping(vertical, from), remove_classify_rule(index) — undo for self-correction"
          - "inspect_draft — read current run-scoped discoveryDraft state"
          - "commit — finalize draft → MappingArtifactV3 persisted (was 'commit_artifact' with JSON blob, replaced 2026-05-21); dispatcher smoke-tests classify against PeekFullRows(5) and rejects when coverage poor"
      prompt_caching: "tool list cache-breakpointed on last ToolDef (ephemeral). Static system block also cached; dynamic trigger context separate uncached block."
      side_effects:
        - "admin.agent_runs Start/AppendTool/AddTokens/Finish around every run"
        - "admin.tenant_action_log: discovery_start + discovery_done events"
      output: |
        MappingArtifactV3 (2026-05-15 evening; ClassifyingField added 2026-05-20)
        persisted to catalog.tenant_catalog_schema.mapping_artifact.
        Shape: {version:3, classifying_field (string, NEW 2026-05-20: inbox top-level key
        carrying the row's category value — e.g. 'product_type' for Shopify,
        'primary_category' for Sephora CSV),
        branches:[{vertical, field_map:[{from,to,transform,default}...]}],
        classify_rules:[{when, then_vertical}], notes, built_at}. One branch per vertical class
        the tenant ships (cosmetics, electronics, furniture, haircare, apparel, footwear, food,
        ski, unknown). Adapter accepts V2 JSONB on read and lifts to one-branch V3 via LiftV2ToV3.
        Empty ClassifyingField on read = legacy artifact → apply_v2 falls back to synonym list.
        Status column now 'active' (was 'validated').
    3_apply_v2:
      file: "internal/usecases/apply_v2.go (924 LOC, up from 800) + apply_v2_transforms.go (~293 LOC); helpers classify_vertical.go + match_key.go"
      use_case: "ApplyV2UseCase.ApplyForTenant(ctx, tenantID) → *ApplyResult"
      flow_v3_bulk_2026_05_22: |
        Apply is now PAGE-BATCHED (Alpha 0.9.3, commit 716f51f). Per inbox page:
        Phase A — applyOne (pure, no DB writes) per row builds a preparedApply struct:
          1. Parse raw JSONB.
          2. classifyContextFromRaw(raw, art) → ClassifyContext{ProductType, Brand, Name, Tags}.
             Reads art.ClassifyingField first (e.g. 'primary_category'); falls back to synonyms
             {product_type, productType, primary_category, category, type, kind, department}.
             Brand synonyms: {brand, vendor, brand_name, manufacturer, maker}.
             Name synonyms: {name, title, product_name, display_name}.
          3. ClassifyVertical(ctx, writer.LookupVertical, art.ClassifyRules, cctx) → (vertical, source)
             cascade: alias → rules → "unknown".
          4. art.FindBranch(vertical): exact → "unknown" fallback. Branch missing → mapping_miss
             with synthetic key "branch.<vertical>" so agent adds it.
          5. Walk branch.field_map: build MasterProductUpsert + MasterCosmeticsUpsert + tier3 patch
             + listing fields; apply transforms. Empty-input tolerance: numeric/int/ml_from_string/
             g_from_string return (nil,nil) on empty → rule dropped for this row, NO mapping_miss.
          6. Override mp.Vertical with classified value (rules don't get to disagree).
          7. Reject row if Name AND SKU both empty → mapping_miss "no signal".
          8. If SKU empty but Name present → synthesize "auto-<source_kind>-<external_id>".
          9. mp.NormalizedMatchKey = NormalizeMatchKey(brand, name); mp.CreateAsPending=true.
         10. Return preparedApply{MP, Cosmetics, Tier3Patch, Listing, InboxItemID, …}.
        Phase B — bulk staging across the whole page:
         11. writer.BulkMatchOrCreateMaster([]MasterProductUpsert) → []MatchResult{MasterID, WasCreated}.
             3-stage cascade still strict-exact (SKU→GTIN→NormalizedMatchKey); INSERT branch sets
             approval_status='pending_approval'+30d when CreateAsPending=true.
         12. Split MatchResults by WasCreated:
             - newly-created rows w/ typed attrs → BulkMergeTier2([]BulkTier2Item) (GROUP D 0.9.6:
               replaced BulkUpsertCosmetics; cosmeticsToMap(p.cosmetics)→patch merged into
               master_products.tier2 via UNNEST + `tier2 = COALESCE(tier2,'{}') || patch`)
             - newly-created any-vertical rows → BulkMergeTier3([]BulkTier3Item) (top-level JSON merge)
             - bind (wasCreated=false) rows → EnrichExistingMaster([]EnrichRequest) already bulk since 0.9.1
         13. BulkUpsertListing([]ListingUpsert) for every row (chunked UNNEST, ~500/chunk).
         14. MarkApplied for the whole page (one UPDATE).
        Total DB roundtrips per 500-row batch: ~10 (was ~2000 in per-row mode).
        Phase C (Alpha 0.9.4): MarkApplied is now ONE BulkMarkApplied per page
        (UPDATE ... WHERE id::text=ANY($1)) instead of per-row loop.
        Phase D (Alpha 0.9.5 — B2): after the action_log apply row, if
        uc.schemaDrift != nil (Redis configured at boot), apply_v2 calls
        schemaDrift.PublishJob(tenant, newDriftRunID()) — best-effort, errors
        log warn 'apply_v2_drift_publish_failed' and don't fail the apply.
        newDriftRunID() is 'apply-<unix_nano>-<6 random bytes hex>' (no UUID dep).
      legacy_per_row_path: |
        Per-row writer methods (MatchOrCreateMaster, UpsertCosmetics, MergeTier3, UpsertListing,
        EnrichExistingMaster single-item) remain on the port — used by tests, single-webhook
        OnWebhook ingest, and as fallbacks. ApplyForTenant no longer uses them.
      first_install_cascade: "If no artifact yet → ApplyForTenant calls discovery.Discover(trigger='first_install') and uses its output."
      mapping_miss_loop: |
        On transform fail, unknown target prefix, missing branch (trigger='unknown_vertical'),
        or required field absent → wraps errMappingMiss with {inbox_item_id, offending_from,
        offending_to, reason}, calls discovery.Discover narrow run. Capped at
        applyV2MaxMissesPerRun=3 per ApplyForTenant call to prevent runaway loops.
      gtin_field_aliases: "assignMasterField routes gtin/barcode/ean/upc all to mp.GTIN; stripGTIN keeps digits only (merchants upload hyphenated/spaced strings)."
      cosmetics_in_non_cosmetics_branch: |
        Agent emits a cosmetics.* rule inside a non-cosmetics branch → forgive: route value
        into tier3 under the stripped key + warn 'apply_v2_cosmetics_rule_in_non_cosmetics_branch'.
        No mapping_miss; soft misuse.
      what_apply_v2_does_NOT_do: |
        Compared to legacy MergeApplyUseCase: no embedding-fuzzy match across tenants, no junk
        classification, no candidate emission, no brand mapping resolution, no embedding
        seeding. Match cascade is STRICT-EXACT only (SKU/GTIN/normalized_match_key) — fuzzy
        is left to curator UI in a later pass. master_products is also IMMUTABLE on bind —
        apply_v2 never overwrites an existing master's columns directly; bind-path data
        flows through master_pending_changes via EnrichExistingMaster, curator approves.
      writes_to:
        - "catalog.master_products (MatchOrCreateMaster: 3-stage cascade insert-on-miss; no UPDATE on hit; insert sets approval_status='pending_approval')"
        - "catalog.master_products.tier2 (BulkMergeTier2 JSONB merge — ONLY when wasCreated; GROUP D 0.9.6, replaced master_cosmetics write)"
        - "catalog.master_products.tier3 (MergeTier3 JSONB merge — ONLY when wasCreated)"
        - "catalog.master_pending_changes (EnrichExistingMaster — ONLY on bind; one row per scalar/array element; NOT EXISTS dedup on status='pending')"
        - "catalog.products (UpsertListing: ON CONFLICT(tenant_id, source_system, source_id))"
        - "catalog.inbox_items.applied_at = NOW()"
        - "admin.tenant_action_log: apply event with full ApplyResult JSON"
    4_orchestrator:
      file: "internal/usecases/update_orchestrator.go (181 LOC)"
      use_case: "UpdateOrchestrator {OnWebhook, ManualSync, OnMappingMiss}"
      rate_limit: "applyRateWindow = 24 * time.Hour. OnWebhook absorbs payload into inbox always; runs apply ONLY if LastAppliedAt > 24h ago. ManualSync bypasses the window."
      rate_limit_port: "ApplyRateLimitPort (in usecases pkg; impl is ApplyRateLimitAdapter reading admin.tenant_action_log for last action='apply' row)"
      called_from:
        - "ShopifyIngester.IngestSingleWebhook → OnWebhook (rate-limited)"
        - "ShopifyIngester.IngestBulkItems → ManualSync (always applies)"
        - "ShopifyIngester.SoftDeleteListing (NEW 2026-05-15) → writer.SoftDeleteListing for products/delete webhook; bypasses orchestrator; emits webhook_received tenant_action_log row"
        - "CatalogV2Handler.HandleSyncNow (curator 'Sync now' button) → ManualSync"
        - "CronDailySourcePull.RunOnce (NEW 2026-05-20) → ManualSync per active tenant; main.go ticker behind KEEPSTAR_DAILY_SOURCE_PULL=1 env gate, 24h interval with 1-minute startup stagger; per-tenant context.WithTimeout(10*time.Minute); errors per-tenant are warn-logged, one bad tenant doesn't abort the pass"

shopify_integration:
